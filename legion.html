<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legion Tracker</title>
<link rel="manifest" href="legion-manifest.json">
<meta name="theme-color" content="#0b0e14">
<link rel="icon" href="legion-icon-192.png">
<link rel="apple-touch-icon" href="legion-icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#0e1117; --panel:#161b24; --panel2:#1d2430; --line:#2a3342; --text:#e6e9ef; --muted:#8b95a7;
  --accent:#4f9cff; --red:#ef4444; --red-bg:#3a1619; --green:#22c55e; --green-bg:#12381f; --amber:#f5b942;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,Segoe UI,Roboto,sans-serif}
body{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{flex:none;z-index:30;background:#0b0e14;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
header h1{font-size:17px;margin:0 8px 0 0;letter-spacing:.3px}
header .date{color:var(--muted);font-size:13px}
.sp{flex:1}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:6px 12px;border-radius:7px}
button:hover{border-color:var(--accent)}
.btn-accent{background:#1d3b66;border-color:#2c5ca0}
.btn-danger:hover{border-color:var(--red)}
nav{display:flex;gap:10px;padding:12px 16px;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--bg);flex:none;z-index:20}
nav button{border-radius:999px;border:2px solid var(--tc);background:#161b24;color:var(--tc);padding:10px 20px;font-size:16px;font-weight:700}
nav button:hover{background:var(--tc);color:#0b0e14}
nav button.on{background:var(--tc);color:#0b0e14;box-shadow:0 3px 12px rgba(0,0,0,.45)}
main{flex:1;min-height:0;display:flex;flex-direction:column;overflow:auto;padding:14px 16px 16px}
main>*{flex:none}
.banner{background:#3b2f10;border:1px solid #6b5316;color:#ffdf8a;padding:10px 14px;border-radius:8px;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hint{color:var(--muted);font-size:12.5px;margin:0 0 10px}
.wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);flex:1 1 auto!important;min-height:200px}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:center;white-space:nowrap}
th{background:var(--panel2);position:sticky;top:0;z-index:5;font-weight:600;font-size:12.5px}
th.grp{top:0}
thead tr:nth-child(2) th{top:30px}
tbody td:first-child,thead tr:first-child th:first-child{position:sticky;left:0;z-index:6;background:var(--panel2);text-align:left;font-weight:600;width:var(--namew,110px);min-width:var(--namew,110px);max-width:var(--namew,110px);overflow:hidden;text-overflow:ellipsis}
thead tr:first-child th:first-child{z-index:8}
tbody tr:hover td{background:#1a2230}
tbody tr:hover td:first-child{background:#222c3c}
input[type=number],input[type=text],select{background:#0e1219;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 6px;font:inherit;width:84px;text-align:center}
input[type=text].name{width:100%;text-align:left}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px #4f9cff33}
input[type=number]::-webkit-inner-spin-button{opacity:.4}
.tg{min-width:58px;padding:5px 8px;border-radius:7px;font-weight:700;border:1px solid var(--red);background:var(--red-bg);color:#ff9a9a}
.tg.on{border-color:var(--green);background:var(--green-bg);color:#7dffa8}
.tg.sm{min-width:44px;padding:3px 6px}
.rk{color:var(--accent);font-weight:700;margin-right:4px}
.rank{display:flex;gap:4px;align-items:center;justify-content:center}
.rank button{padding:4px 9px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.pills button.on{background:#1d3b66;border-color:var(--accent)}
.pills.shops button.on{background:#12381f;border-color:var(--green)}
td.wc{white-space:normal;text-align:left;min-width:230px}
.ib{display:inline-block;background:var(--green-bg);border:1px solid var(--green);color:#7dffa8;border-radius:99px;padding:2px 9px;margin:2px;font-size:12.5px}
.ib.next{background:#2a2a14;border-color:#6b5316;color:var(--amber)}
td input.it{width:100%;text-align:left}
.cnt{font-variant-numeric:tabular-nums;color:var(--muted)}
.cnt.full{color:var(--green);font-weight:700}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600}
.b-adv{background:var(--green-bg);color:#7dffa8;border:1px solid var(--green)}
.b-same{background:#2a2a14;color:var(--amber);border:1px solid #6b5316}
.b-dem{background:var(--red-bg);color:#ff9a9a;border:1px solid var(--red)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
.card h3{margin:0 0 8px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.card table th,.card table td{padding:4px 5px;border-right:none}
.card table td:first-child,.card table th:first-child{position:static;background:transparent;min-width:0;width:auto;max-width:none;overflow:visible}
.card .wrap2{border:none}
.sep td,.sep th{border-top:2px solid var(--line)}
.toast{position:fixed;bottom:16px;right:16px;background:#12381f;border:1px solid var(--green);color:#9dffc0;padding:6px 12px;border-radius:8px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
.calc{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:12px}
.calc select,.calc input{width:auto;min-width:90px}
.leg{display:flex;gap:14px;color:var(--muted);font-size:12.5px;margin:0 0 8px;flex-wrap:wrap}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
.rm{padding:2px 8px;color:var(--muted)}
.rm:hover{color:var(--red);border-color:var(--red)}
.bar{height:8px;background:#0e1219;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .2s}
.bar i.full{background:var(--green)}
.irow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center}
.irow:last-child{border-bottom:none}
.barrow{grid-column:1/-1}
.shl{color:var(--muted);font-size:12.5px;margin:6px 0 2px}
.fcard{border-color:#6b5316}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.tile{background:#0e1219;border:2px solid var(--tc);border-radius:16px;padding:12px 10px;text-align:center}
.tile .tq{font-size:26px;font-weight:800;color:var(--tc);line-height:1.1}
.tile .tn{font-weight:700;margin-top:4px}
.tile .ts{color:var(--muted);font-size:12px;margin-top:4px}
.frow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.frow select{width:auto;min-width:80px}
#view .card{margin-bottom:12px}
#view .cards .card{margin-bottom:0}
.rsz{position:absolute;right:0;top:0;bottom:0;width:16px;cursor:col-resize;touch-action:none;display:flex;align-items:center;justify-content:center}
.rsz::after{content:'';width:4px;height:55%;border-radius:3px;background:var(--accent);opacity:.8}
.ewt{color:var(--amber);font-weight:700}
.rwwrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:16px}
.rwb{min-width:68px;padding:4px 8px;border-radius:7px;font-weight:700;border:1px solid var(--line);background:var(--panel2);color:var(--muted)}
.rwb.on{border-color:var(--amber);background:#2a2a14;color:var(--amber)}
.stiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:6px}
.stile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:var(--bg);color:var(--tx);border:3px solid var(--bc);border-radius:14px;padding:10px 10px 12px;font-weight:600;min-height:112px;cursor:pointer}
.stile:hover{border-color:var(--bc);filter:brightness(1.05)}
.stile .trow{display:flex;gap:8px;align-items:flex-start;width:100%}
.stile .cbx{flex:none;width:22px;height:22px;border:3px solid var(--bc);border-radius:6px;background:#fff;color:#fff;font-size:15px;line-height:16px;text-align:center;font-weight:900}
.stile.sel .cbx{background:var(--bc)}
.stile .ttl{font-size:15px;font-weight:800;line-height:1.2}
.stile .big{font-size:26px;font-weight:900;line-height:1.1;margin-top:2px}
.stile .sub{font-size:12.5px;opacity:.8}
.stile .pill{display:inline-block;background:var(--bc);color:#fff;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700}
.stile.sel{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--bc)}
.buybar{position:sticky;top:0;z-index:12;background:#0f141d;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:12px;box-shadow:0 6px 16px rgba(0,0,0,.55)}
.bbmain{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;border-left:5px solid var(--bc);padding-left:10px}
.stepper{display:flex;gap:8px;align-items:center}
.stepper button{padding:2px 12px;font-size:18px}
.bbbtns{display:flex;gap:8px;margin-left:auto}
button.buy{background:#12381f;border-color:var(--green);color:#9dffc0;font-weight:800;padding:8px 16px}
.bblast{margin-top:8px}
.bblast button{padding:2px 10px;margin-left:6px}
@media (max-width:700px){.cards{grid-template-columns:1fr}}
@media (max-width:700px),(max-height:620px){
  header{padding:6px 10px;gap:6px;flex-wrap:nowrap;overflow-x:auto}
  header h1{font-size:14px;white-space:nowrap;margin:0}
  header .date{display:none}
  header button{white-space:nowrap;padding:5px 9px;font-size:13px}
  nav button{white-space:nowrap;padding:9px 16px;font-size:15px}
  nav{flex-wrap:nowrap;overflow-x:auto;padding:8px 10px;gap:8px}
  main{padding:8px 10px}
  .hint{display:none}
  body.typing header,body.typing nav,body.typing .banner{display:none}
}
</style>
</head>
<body>
<header>
  <h1>⚔ Legion Daily Activity Tracker <small style="color:#7dffa8;font-weight:400">v19</small></h1>
  <span class="date" id="dateLbl"></span>
  <span class="sp"></span>
  <button id="btnDay" title="Reset all daily Done buttons to red">🌅 New Day</button>
  <button id="btnWeek" title="Move Current Week damage to Previous Week">📅 New Week</button>
  <button id="btnSeason" title="Start a new 3-month season: everyone back to Bronze">🌋 New Season</button>
  <button id="btnCsv">⬇ Excel (CSV)</button>
  <button id="btnExp">💾 Backup</button>
  <button id="btnImp">📂 Restore</button>
  <input type="file" id="fileImp" accept=".json" hidden>
</header>
<nav id="tabs"></nav>
<main id="view"></main>
<div class="toast" id="toast">Saved</div>

<script>
/* ============ CONFIG ============ */
const DAILY=[['mission','Mission Daily'],['lh','LH'],['tc','TC'],['camp','Camp'],['assist','Play Assist'],['endless','Endless'],['drone','Drone'],['sentinel','Sentinel'],['md','MD'],['chips','Chips'],['tasking','Tasking']];
const DAILY_GROUPS=[
 {label:'🌙 Active 9 PM',color:'#a78bfa',cols:[['lh','#c4b5fd'],['tc','#93c5fd'],['camp','#a5b4fc'],['drone','#7dd3fc'],['sentinel','#d8b4fe'],['md','#f0abfc']]},
 {label:'🌅 Active 12:00 AM',color:'#fbbf24',cols:[['mission','#fde68a'],['assist','#fdba74'],['endless','#fcd34d'],['chips','#fca5a5']]},
 {label:'Other',color:'#94a3b8',cols:[['tasking','#cbd5e1']]}
];
const LEGION=[['icarus','Icarus'],['anansi','Anansi'],['hydra','Hydra'],['pegasus','Pegasus'],['charon','Charon'],['jormungand','Jormungand'],['chimera','Chimera']];
const SEASON=[['atlas','Atlas'],['kraken','Kraken'],['arachne','Arachne']];
const SETS=[['simple','Simple'],['conq','Conquerer'],['dest','Destroyer'],['thor','Thor'],['optimus','Optimus Prime'],['mega','Megatron']];
const PIECES=['Main Gun','Wing Gun','Missile','Armor'];
const TIERS=[ // name, [rankRange,outcome] ..., tierChange, reward
 ['Bronze',[['1-30','Advance'],['31-50','Unchanged']],'Bronze to Silver',5000],
 ['Silver',[['1-20','Advance'],['21-35','Unchanged'],['36-50','Demotion to Lower Tier']],'Silver to Gold',7500],
 ['Gold',[['1-20','Advance'],['21-35','Unchanged'],['36-50','Demotion to Lower Tier']],'Gold to Platinum',10000],
 ['Platinum',[['1-15','Advance'],['16-35','Unchanged'],['36-50','Demotion to Lower Tier']],'Platinum to Diamond',12500],
 ['Diamond',[['1-10','Advance'],['11-25','Unchanged'],['26-50','Demotion to Lower Tier']],'Diamond to Masters',18750],
 ['Master',[['1-10','Advance'],['11-25','Unchanged'],['26-50','Demotion to Lower Tier']],'Master to Legend',25000],
 ['Legend',[['1-10','Unchanged'],['11-50','Demotion to Lower Tier']],'—',null]
];
const KEY='legionTrackerV1';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const SHOP_DEFS=[['titan','Titan Shop'],['star','Star Scramble Shop'],['planet','Planet War Shop'],['battle','Battlefield Shop'],['recycle','Recycling Shop']];
function defaultShops(){
  const mk=(id,name,items)=>({id,name,items:items.map(([n,c])=>({id:uid(),name:n,cost:c}))});
  return SHOP_DEFS.map(([id,name])=>mk(id,name,
    id==='titan'?[['Main Gun',11000],['Wing Gun',8200],['Missile',8200],['Armor Shield',8200],['Titan Fighter Shards',750]]
   :id==='planet'?[['Main Gun',33000],['Wing Gun',24600],['Missile',24600],['Armor Shield',24600],['Titan Fighter Shards',2200]]
   :[]));
}
function migrate(){
  if(!S.shops)S.shops=[];
  if(S.focus==null)S.focus='';
  if(S.focusMonth==null)S.focusMonth='';
  defaultShops().forEach(d=>{if(!S.shops.some(x=>x.id===d.id))S.shops.push(d)});
  S.players.forEach(p=>{
    if(!p.points)p.points={};
    if(!p.bought)p.bought={};
    if(!p.rewards)p.rewards={};
    if(!p.log)p.log=[];
    if(!p.focus)p.focus={item:'',qty:1};
    DAILY.forEach(([k])=>{if(p.daily[k]==null)p.daily[k]=false});
  });
}

/* ============ STATE ============ */
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function blankPlayer(name){
  const p={id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),name,cc:null,pp:null,bp:null,rare:null,ss:null,loot:null,tcTier:'',tcRank:null,daily:{},legion:{},season:{},gear:{},focus:{item:'',qty:1},bought:{},log:[],rewards:{}};
  DAILY.forEach(([k])=>p.daily[k]=false);
  LEGION.forEach(([k])=>p.legion[k]=[null,null]);
  SEASON.forEach(([k])=>p.season[k]=[null,null]);
  SETS.forEach(([k])=>p.gear[k]=[false,false,false,false]);
  p.points={};
  return p;
}
/* Seed = data from Daily_Activity_Report_WF_Updated_23-10-26.xlsx */
function seed(){
  const R=[ // name,cc,pp,bp,rare,loot,arachne, legion [prev,cur]x7 (icarus,anansi,hydra,pegasus,charon,jormungand,chimera)
   ['Maverick',45,1300,35,572,52,60,[[3300,3600],[3200,3600],[3900,null],[2400,3000],[20,null],[20,null],[4500,4700]]],
   ['DaFlawless',45,1066,30,101,40,40,[[1900,2400],[1800,2000],[1700,null],[1400,2300],[7.5,null],[7.5,null],[2000,2500]]],
   ['Blackhawk',45,970,22,101,49,40,[[1200,null],[1300,1500],[1100,null],[1100,null],[7.1,null],[null,null],[1500,1800]]],
   ['War Machine',30,749,7,null,21,null,[[1300,1300],[1100,1400],[1000,null],[944,1200],[0.8,null],[null,null],[1300,1300]]],
   ['Knightrider',37,802,11,480,47,null,[[1100,null],[1300,1300],[1100,null],[787,1290],[1.4,null],[null,null],[1200,1600]]],
   ['BruteNose',24,null,5.8,72,7,2.4,[[1100,null],[1100,1400],[1000,null],[898,null],[null,null],[null,null],[1400,1300]]],
   ['Maverick Bilal',25,781,9,69,10,null,[[1100,null],[1100,null],[1000,null],[856,1000],[0.7,null],[null,null],[1100,null]]],
   ['Kill Machine',33,null,14,328,32,12,[[1100,null],[1100,1300],[1000,null],[862,1100],[2.2,null],[2.2,null],[1000,null]]],
   ['EntityX',null,674,null,null,null,null,[[335,442],[566,null],[299,null],[406,null],[null,null],[null,null],[631,null]]],
   ['JetElite',null,null,null,null,null,null,[[4.3,null],[5,null],[10.4,null],[9.7,null],[null,null],[null,null],[7.4,null]]]
  ];
  return R.map(r=>{
    const p=blankPlayer(r[0]);
    p.cc=r[1];p.pp=r[2];p.bp=r[3];p.rare=r[4];p.loot=r[5];
    p.season.arachne=[null,r[6]];
    LEGION.forEach(([k],i)=>p.legion[k]=r[7][i].slice());
    if(['Maverick','DaFlawless','Blackhawk','War Machine','Knightrider','BruteNose','Maverick Bilal','Kill Machine'].includes(r[0]))
      DAILY.forEach(([k])=>p.daily[k]=(k!=='md'));
    return p;
  });
}
let S;
function load(){
  try{const raw=localStorage.getItem(KEY);if(raw){S=JSON.parse(raw);migrate();return}}catch(e){}
  S={date:todayStr(),players:seed(),shops:defaultShops()};migrate();
}
let saveWarned=false;
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S));toast('Saved')}
  catch(e){if(!saveWarned){saveWarned=true;alert('Browser storage is unavailable here, so changes will be lost on reload. Use 💾 Backup regularly.')}}
}
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),800)}
const P=id=>S.players.find(p=>p.id===id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const val=v=>v==null?'':v;

/* ============ TABS ============ */
const TABS=[['daily','✅ Daily Tasks','#22c55e'],['players','👤 Players & Power','#4f9cff'],['legion','🐉 Legion Hunt','#a78bfa'],['season','🌋 Titan Challenge','#fb923c'],['shops','🛒 Shops & Resources','#2dd4bf']];
let tab=(()=>{try{return localStorage.getItem(KEY+'_tab')||'daily'}catch(e){return 'daily'}})();
if(!TABS.some(t=>t[0]===tab))tab='daily';

function renderTabs(){
  document.getElementById('tabs').innerHTML=TABS.map(([k,l,c])=>`<button data-tab="${k}" class="${k===tab?'on':''}" style="--tc:${c}">${l}</button>`).join('');
}
function render(){
  document.getElementById('dateLbl').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'short',year:'numeric'})+'  ·  Tracking day: '+S.date;
  renderTabs();
  const v=document.getElementById('view');
  const oldW=v.querySelector('.wrap'),sx=oldW?oldW.scrollLeft:0,sy=oldW?oldW.scrollTop:0,mt=v.scrollTop,sameTab=v.dataset.shown===tab;
  const banner=S.date!==todayStr()?`<div class="banner">📆 The day has changed since your last session (${S.date}). <button class="btn-accent" id="bnDay">Start new day (reset Done buttons)</button> <button id="bnKeep">Keep as is</button></div>`:'';
  v.innerHTML=banner+({daily:vDaily,players:vPlayers,legion:vLegion,season:vSeason,gear:vGear,shops:vShops,tier:vTier}[tab])();
  v.dataset.shown=tab;
  setTabOrder();
  document.querySelectorAll('#view .wrap thead tr:first-child th:first-child').forEach(th=>{const d=document.createElement('span');d.className='rsz';d.title='Drag to resize';th.appendChild(d)});
  if(sameTab){const w=v.querySelector('.wrap');if(w){w.scrollLeft=sx;w.scrollTop=sy}v.scrollTop=mt}
}

/* Keyboard Next / Tab goes DOWN the column instead of right */
function setTabOrder(){
  let n=1;
  document.querySelectorAll('#view table').forEach(t=>{
    const rows=[...t.querySelectorAll('tbody tr')];if(!rows.length)return;
    const cols=Math.max(...rows.map(r=>r.children.length));
    for(let c=0;c<cols;c++)rows.forEach(r=>{const td=r.children[c];if(!td)return;td.querySelectorAll('input,select').forEach(el=>{el.tabIndex=n++})});
  });
}
/* ============ VIEWS ============ */
function tg(on,attrs,txt){return `<button class="tg ${on?'on':''}" ${attrs}>${on?'✓ Done':(txt||'✕')}</button>`}
function vDaily(){
  const lab=k=>DAILY.find(d=>d[0]===k)[1];

let shopView='can',shopSel='titan';
const fmt=n=>(+n).toLocaleString(undefined,{maximumFractionDigits:2});
function shopById(id){return S.shops.find(x=>x.id===id)||S.shops[0]}
const normName=s=>String(s||'').trim().toLowerCase();
let canPid='';
function allItemNames(){
  const seen={},out=[];
  S.shops.forEach(sh=>sh.items.forEach(it=>{const k=normName(it.name);if(k&&+it.cost>0&&!seen[k]){seen[k]=1;out.push(it.name.trim())}}));
  return out;
}
const barHtml=pct=>`<div class="bar"><i class="${pct>=100?'full':''}" style="width:${Math.max(0,Math.min(100,pct))}%"></i></div>`;
const iq=it=>Math.max(1,+it.qty||1);
const bkey=(sh,it)=>sh.id+'|'+it.id;
const boughtOf=(p,sh,it)=>+((p.bought||{})[bkey(sh,it)])||0;
function calc(it,pts,done){
  const q=iq(it),cost=+it.cost;
  const stock=+it.stock>0?Math.max(0,+it.stock-(+done||0)):Infinity;
  const maxPacks=stock===Infinity?Infinity:Math.floor(stock/q);
  const aff=Math.floor(pts/cost+1e-9),packs=Math.min(aff,maxPacks);
  return {q,cost,stock,maxPacks,aff,packs,units:packs*q,capped:aff>maxPacks};
}
function itemRows(p,filterKey){
  const rows=[];
  S.shops.forEach(sh=>sh.items.forEach(it=>{
    if(!(+it.cost>0))return;
    if(filterKey&&normName(it.name)!==filterKey)return;
    const pts=+((p.points||{})[sh.id])||0;
    const c=calc(it,pts,boughtOf(p,sh,it));
    rows.push({shop:sh,item:it,pts,c,n:c.units,pct:c.maxPacks===0?0:Math.min(100,pts/it.cost*100),need:Math.max(0,it.cost-pts)});
  }));
  return rows;
}
const ownedOf=(p,key)=>{let t=0;S.shops.forEach(sh=>sh.items.forEach(it=>{if(normName(it.name)===key)t+=boughtOf(p,sh,it)}));return t};
function focusRes(p){
  const f=p.focus,need=Math.max(1,+f.qty||1);
  if(!f.item)return '<span class="cnt">Choose the item you need this month and how many.</span>';
  const key=normName(f.item),rows=itemRows(p,key);
  if(!rows.length)return '<span class="cnt">No shop has this item in its price list.</span>';
  const owned=ownedOf(p,key),remain=Math.max(0,need-owned);
  const totalUnits=rows.reduce((t,r)=>t+r.n,0),canNow=Math.min(totalUnits,remain);
  const fracUnits=Math.max(...rows.map(r=>(r.c.packs<r.c.maxPacks&&r.c.maxPacks>0)?(r.pts/r.item.cost-Math.floor(r.pts/r.item.cost))*r.c.q:0));
  const overall=remain===0?100:Math.min(100,(owned+canNow+(totalUnits>=remain?0:fracUnits))/need*100);
  const status=remain===0?'<span class="ib">✓ Goal reached</span>':'<span class="cnt">'+(owned?fmt(owned)+' bought · ':'')+fmt(canNow)+' of '+fmt(remain)+' still-needed buyable</span>';
  let h=`<div class="irow"><div><b>${fmt(need)} × ${esc(f.item)}</b></div><div>${status} <span class="cnt">${Math.floor(overall)}%</span></div><div class="barrow">${barHtml(overall)}</div></div>`;
  if(remain>0){
    h+=`<p class="cnt" style="margin:6px 0 2px">If buying the remaining ${fmt(remain)} from one shop:</p>`;
    rows.forEach(r=>{
      const packs=Math.ceil(remain/r.c.q),needPts=packs*r.item.cost,stockOk=r.c.stock>=packs*r.c.q;
      const pct=stockOk?Math.min(100,r.pts/needPts*100):0;
      h+=`<div class="shl">${esc(r.shop.name)}: ${fmt(r.pts)} / ${fmt(needPts)} pts · ${!stockOk?'only '+fmt(r.c.stock)+' in stock':needPts<=r.pts?'<b style="color:#7dffa8">✓ enough</b>':'need '+fmt(needPts-r.pts)+' more'} (${Math.floor(pct)}%)</div>`+barHtml(pct);
    });
  }
  return h;
}
function focusBlock(p){
  const f=p.focus||(p.focus={item:'',qty:1});
  return `<div class="card fcard"><h3>🎯 Focus Item (this month)</h3>
  <div class="frow"><select id="focusSel"><option value="">— choose item —</option>${allItemNames().map(n=>`<option ${normName(n)===normName(f.item)?'selected':''}>${esc(n)}</option>`).join('')}</select>

  <div id="focusRes">${focusRes(p)}</div></div>`;
}
/* ----- shop tiles, selection and purchase ----- */
const SHOP_COL={titan:['#fff1d6','#e8890c','#4a2b00'],star:['#ece3ff','#7c3aed','#26104f'],planet:['#d9f4ec','#10a37f','#04382b'],battle:['#dbeaff','#2f7fe8','#0a2850'],recycle:['#ffdfe9','#e0447a','#52082a']};
const SHOP_FALL=[['#fff9c4','#d4b106','#3d3300'],['#e0f7fa','#00acc1','#00363d'],['#f3e5f5','#ab47bc','#35103b']];
const shopCol=(sh,i)=>SHOP_COL[sh.id]||SHOP_FALL[i%SHOP_FALL.length];
let sel='',selPk=1;
function selInfo(p){
  if(!sel)return null;
  const [sid,iid]=sel.split('|');
  const sh=S.shops.find(x=>x.id===sid),it=sh&&sh.items.find(x=>x.id===iid);
  if(!it||!(+it.cost>0))return null;
  const c=calc(it,+((p.points||{})[sid])||0,boughtOf(p,sh,it));
  if(c.packs<1)return null;
  return {sh,it,c,idx:S.shops.indexOf(sh)};
}
function buyBar(p){
  const si=selInfo(p);if(!si)sel='';
  const log=p.log||[],last=log[log.length-1];
  let h='<div class="buybar">';
  if(si){
    selPk=Math.max(1,Math.min(si.c.packs,selPk));
    const bc=shopCol(si.sh,si.idx)[1];
    h+=`<div class="bbmain" style="--bc:${bc}"><div><b>${esc(si.it.name)}</b> <span class="cnt">· ${esc(si.sh.name)}</span></div>
    <div class="stepper"><button data-selpk="-1">−</button><b>${fmt(selPk)}</b><button data-selpk="1">＋</button><span class="cnt">${si.c.q>1?'× pack of '+fmt(si.c.q):'pcs'}</span></div>
    <div>= <b>${fmt(selPk*si.c.q)}</b> ${selPk*si.c.q===1?'item':'items'} for <b>${fmt(selPk*si.c.cost)}</b> pts</div>
    <div class="bbbtns"><button class="buy" data-buy="1">✅ Purchase</button><button data-cancelsel="1">✕</button></div></div>`;
  }else h+='<span class="cnt">👆 Tap an item tile to select it, then press Purchase.</span>';
  if(last)h+=`<div class="bblast cnt">Last purchase: ${fmt(last.units)} × ${esc(last.name)} (${fmt(last.cost)} pts) <button data-undo="1">↩ Undo</button></div>`;
  return h+'</div>';
}
function tilesHtml(p){
  const tiles=[];
  S.shops.forEach((sh,si)=>sh.items.forEach(it=>{
    if(!(+it.cost>0))return;
    const c=calc(it,+((p.points||{})[sh.id])||0,boughtOf(p,sh,it));
    if(c.units<1)return;
    const [bg,bc,tx]=shopCol(sh,si),key=sh.id+'|'+it.id,on=key===sel;
    tiles.push(`<button class="stile${on?' sel':''}" data-tile="${key}" style="--bg:${bg};--bc:${bc};--tx:${tx}"><span class="trow"><span class="cbx">${on?'✓':''}</span><span class="ttl">${esc(it.name||'?')}</span></span><span class="big">×${fmt(c.units)}</span><span class="sub">${esc(sh.name)}</span><span class="pill">${c.q>1?fmt(c.q)+' for ':''}${fmt(c.cost)} pts${c.capped?' · stock limit':''}</span></button>`);
  }));
  return tiles.length?`<div class="stiles">${tiles.join('')}</div>`:'<span class="cnt">Nothing affordable yet.</span>';
}
function canResult(p){
  const bar=buyBar(p);
  return bar+`<div class="card"><h3>🛍 Items you can buy now <span class="cnt">tap one to select</span></h3>${tilesHtml(p)}</div>`+focusBlock(p);
}
function refreshCan(){const el=document.getElementById('canRes');const p=P(canPid);if(el&&p)el.innerHTML=canResult(p)}
function doBuy(){
  const p=P(canPid),si=p&&selInfo(p);if(!si)return;
  const packs=Math.max(1,Math.min(si.c.packs,selPk)),units=packs*si.c.q,cost=packs*si.c.cost;
  if(!confirm('Buy '+fmt(units)+' × '+si.it.name+' from '+si.sh.name+' for '+fmt(cost)+' points?'))return;
  const pts=+((p.points||{})[si.sh.id])||0;
  p.points[si.sh.id]=Math.round((pts-cost)*100)/100;
  const k=bkey(si.sh,si.it);if(!p.bought)p.bought={};p.bought[k]=(+p.bought[k]||0)+units;
  if(!p.log)p.log=[];p.log.push({shop:si.sh.id,item:si.it.id,name:si.it.name,units,cost,t:Date.now()});
  if(p.log.length>100)p.log.shift();
  sel='';selPk=1;save();render();
}
function undoBuy(){
  const p=P(canPid);if(!p||!p.log||!p.log.length)return;
  const l=p.log[p.log.length-1];
  if(!confirm('Undo the last purchase? '+fmt(l.cost)+' points are given back and '+fmt(l.units)+' × '+l.name+' returns to stock.'))return;
  p.log.pop();
  p.points[l.shop]=Math.round(((+p.points[l.shop]||0)+l.cost)*100)/100;
  const k=l.shop+'|'+l.item;if(p.bought&&p.bought[k]!=null)p.bought[k]=Math.max(0,p.bought[k]-l.units);
  save();render();
}

  S.players.forEach(p=>{p.bought={};p.log=[]});save();render();
}

/* ============ LOGIC ============ */
const bcls=o=>o==='Advance'?'b-adv':o==='Unchanged'?'b-same':'b-dem';
function tierOutcome(tier,rank){
  const t=TIERS.find(x=>x[0]===tier);if(!t||!rank)return null;
  for(const [rng,out] of t[1]){const [a,b]=rng.split('-').map(Number);if(rank>=a&&rank<=b)return {out,change:t[2],pts:t[3]}}
  return null;
}
function resultBadge(p){
  const r=tierOutcome(p.tcTier,p.tcRank);if(!r)return '<span class="cnt">—</span>';
  const got=r.out==='Advance'&&r.pts&&p.rewards&&p.rewards[p.tcTier];
  return `<span class="badge ${bcls(r.out)}">${r.out==='Advance'?'⬆ '+r.change:r.out==='Unchanged'?'＝ Unchanged':'⬇ Demotion'}</span>`+
    (got?' <span class="cnt" title="Tier rewards are paid one time only">🎁 already received · no reward</span>':(r.out==='Advance'&&r.pts?` <span class="cnt">${r.pts.toLocaleString()} pts</span>`:''));
}
function getPath(p,parts){let o=p;for(let i=0;i<parts.length-1;i++)o=o[parts[i]];return [o,parts[parts.length-1]]}

/* ============ EVENTS ============ */
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.tab){tab=t.dataset.tab;try{localStorage.setItem(KEY+'_tab',tab)}catch(_){ }render();return}
  if(t.dataset.tg){
    const [id,grp,k,i]=t.dataset.tg.split('|');const p=P(id);
    if(grp==='daily')p.daily[k]=!p.daily[k];else p.gear[k][+i]=!p.gear[k][+i];
    save();render();return;
  }
  if(t.dataset.all){const p=P(t.dataset.all);const allOn=DAILY.every(([k])=>p.daily[k]);DAILY.forEach(([k])=>p.daily[k]=!allOn);save();render();return}
  if(t.dataset.mv){const [id,d]=t.dataset.mv.split('|');movePlayer(id,S.players.indexOf(P(id))+ +d);return}
  if(t.dataset.rw){const [id,tier]=t.dataset.rw.split('|');const p=P(id);p.rewards[tier]=!p.rewards[tier];save();render();return}
  if(t.dataset.tile){const k=t.dataset.tile;sel=sel===k?'':k;selPk=1;refreshCan();return}
  if(t.dataset.selpk){selPk+=+t.dataset.selpk;refreshCan();return}
  if(t.dataset.cancelsel){sel='';refreshCan();return}
  if(t.dataset.buy){doBuy();return}
  if(t.dataset.undo){undoBuy();return}
  if(t.dataset.newmonth){newMonth();return}
  if(t.dataset.sub){shopView=t.dataset.sub;render();return}
  if(t.dataset.shopsel){shopSel=t.dataset.shopsel;render();return}
  if(t.dataset.additem){const sh=shopById(t.dataset.additem);sh.items.push({id:uid(),name:'',cost:null,qty:1,stock:null});save();render();
    const ins=document.querySelectorAll('#view input.it');const l=ins[ins.length-1];if(l)l.focus();return}
  if(t.dataset.delitem){const [sid,iid]=t.dataset.delitem.split('|');const sh=shopById(sid);const it=sh.items.find(x=>x.id===iid);
    if(confirm('Remove “'+(it&&it.name||'this item')+'” from '+sh.name+'?')){sh.items=sh.items.filter(x=>x.id!==iid);save();render()}return}
  if(t.dataset.del){const p=P(t.dataset.del);if(confirm('Remove '+p.name+' and all their data?')){S.players=S.players.filter(x=>x!==p);save();render()}return}
  switch(t.id){
    case 'addP':{const n=prompt('New player ID name:');if(n&&n.trim()){S.players.push(blankPlayer(n.trim()));save();render()}break}
    case 'btnDay':case 'bnDay':newDay();break;
    case 'bnKeep':S.date=todayStr();save();render();break;
    case 'btnWeek':newWeek();break;
    case 'btnSeason':newSeason();break;
    case 'btnCsv':exportCsv();break;
    case 'btnExp':exportJson();break;
    case 'btnImp':document.getElementById('fileImp').click();break;
  }
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='cTier'||el.id==='cRank'){
    const r=tierOutcome(document.getElementById('cTier').value,+document.getElementById('cRank').value);
    document.getElementById('cOut').innerHTML=r?`<span class="badge ${bcls(r.out)}">${r.out}</span> ${r.out==='Advance'?r.change+' · '+r.pts.toLocaleString()+' reward points':''}`:'Rank outside this tier\'s range';
    return;
  }
  if(el.dataset.item){
    const [sid,iid,f]=el.dataset.item.split('|');const it=shopById(sid).items.find(x=>x.id===iid);if(!it)return;
    if(f==='name')it.name=el.value;
    else{const clean=el.value.replace(/,/g,'.').replace(/[^0-9.]/g,'');if(clean!==el.value)el.value=clean;const v=parseFloat(clean);it[f]=isNaN(v)?null:v}
    save();return;
  }
  if(el.id==='focusQtyIn'){
    const clean=el.value.replace(/[^0-9]/g,'');if(clean!==el.value)el.value=clean;
    const p=P(canPid);if(!p)return;p.focus.qty=clean===''?null:parseInt(clean,10);
    const r=document.getElementById('focusRes');if(r)r.innerHTML=focusRes(p);save();return;
  }
  const d=el.dataset.in;if(!d)return;
  const parts=d.split('|');const p=P(parts[0]);const path=parts.slice(1);
  const [o,k]=getPath(p,path);
  if(el.dataset.num){
    const clean=el.value.replace(/,/g,'.').replace(/[^0-9.]/g,'');if(clean!==el.value)el.value=clean;
    let v=el.value===''?null:parseFloat(el.value);if(v!=null&&isNaN(v))v=null;
    if(v!=null&&path[0]==='cc'&&v>84){v=84;el.value=84}
    if(v!=null&&path[0]==='tcRank'&&v>50){v=50;el.value=50}
    o[k]=v;
  }else o[k]=el.value;
  if(path[0]==='points'&&shopView==='can')refreshCan();
  if(path[0]==='season'){const c=document.getElementById('ew-'+p.id+'-'+path[1]);if(c)c.textContent=ewt(o[k])}
  if(path[0]==='tcTier'||path[0]==='tcRank'){const c=document.getElementById('res-'+p.id);if(c)c.innerHTML=resultBadge(p)}
  save();
});
/* keep the field visible when the phone keyboard opens */
let typT;
document.addEventListener('focusin',e=>{
  if(!/^(INPUT|SELECT)$/.test(e.target.tagName))return;
  if(e.target.tagName==='INPUT')e.target.setAttribute('enterkeyhint','enter');
  clearTimeout(typT);document.body.classList.add('typing');
  const el=e.target;
  if(el.tagName==='INPUT'){const v0=el.value;const sel=()=>{if(document.activeElement===el&&el.value===v0){try{el.select()}catch(_){}}};setTimeout(sel,0);setTimeout(sel,120)}
  setTimeout(()=>{try{el.scrollIntoView({block:'center',inline:'nearest'})}catch(_){}},350);
});
/* Enter / keyboard action button: go to the box BELOW (same column), not to the right */
document.addEventListener('keydown',e=>{
  const el=e.target;
  if((e.key!=='Enter'&&e.keyCode!==13)||el.tagName!=='INPUT')return;
  e.preventDefault();
  if(el.dataset.rank){el.blur();return}
  const td=el.closest('td');const tr=td&&td.parentElement;if(!tr){el.blur();return}
  const idx=[...tr.children].indexOf(td);
  const next=e.shiftKey?tr.previousElementSibling:tr.nextElementSibling;
  const target=next&&next.children[idx]&&next.children[idx].querySelector('input:not([data-rank]),select');
  if(target)target.focus();else el.blur();
});
document.addEventListener('focusout',()=>{
  clearTimeout(typT);
  typT=setTimeout(()=>{if(!/^(INPUT|SELECT)$/.test((document.activeElement||{}).tagName||''))document.body.classList.remove('typing')},250);
});
document.addEventListener('change',e=>{
  const id=e.target.dataset&&e.target.dataset.rank;if(!id)return;
  const n=parseInt(e.target.value,10);if(!n){render();return}
  movePlayer(id,n-1);
});
document.addEventListener('change',e=>{
  if(e.target.id==='canPlayer'){canPid=e.target.value;sel='';selPk=1;render();return}
  if(e.target.id==='focusSel'){
    const p=P(canPid);if(!p)return;if(!p.focus)p.focus={item:'',qty:1};
    if(e.target.id==='focusSel')p.focus.item=e.target.value;
    save();refreshCan();
  }
});
document.getElementById('fileImp').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{
    try{const d=JSON.parse(r.result);if(!d.players)throw 0;if(confirm('Replace all current data with this backup?')){S=d;migrate();save();render()}}
    catch(_){alert('That file is not a valid tracker backup.')}
    e.target.value='';
  };r.readAsText(f);
});

/* drag the bar on the Player column header to resize it */
let rz=null;
document.addEventListener('pointerdown',e=>{const h=e.target.closest&&e.target.closest('.rsz');if(!h)return;e.preventDefault();rz={x:e.clientX,w:h.parentElement.getBoundingClientRect().width};try{h.setPointerCapture(e.pointerId)}catch(_){}});
document.addEventListener('pointermove',e=>{if(!rz)return;const w=Math.max(70,Math.min(280,Math.round(rz.w+e.clientX-rz.x)));document.documentElement.style.setProperty('--namew',w+'px')});
const endRz=()=>{if(!rz)return;rz=null;try{localStorage.setItem(KEY+'_namew',document.documentElement.style.getPropertyValue('--namew'))}catch(_){}};
document.addEventListener('pointerup',endRz);document.addEventListener('pointercancel',endRz);
try{const w=localStorage.getItem(KEY+'_namew');if(w)document.documentElement.style.setProperty('--namew',w)}catch(_){}

/* ============ ACTIONS ============ */
function movePlayer(id,to){
  const from=S.players.findIndex(p=>p.id===id);to=Math.max(0,Math.min(S.players.length-1,to));
  if(from<0||to===from){render();return}
  const [p]=S.players.splice(from,1);S.players.splice(to,0,p);save();render();
}
function newDay(){
  if(!confirm('Start a new day? All Daily Task buttons will turn red again. (Numbers are not touched.)'))return;
  S.players.forEach(p=>DAILY.forEach(([k])=>p.daily[k]=false));
  S.date=todayStr();save();render();
}
function newSeason(){
  if(!confirm('Start a new season?\n\n• Every player goes back to Bronze (TC Tier = Bronze, TC Rank cleared)\n• “Tier rewards already received” is cleared, so rewards can be earned again\n\nThis cannot be undone. Take a 💾 Backup first if unsure.'))return;
  const clearBoss=confirm('Also clear Titan Challenge damage (Atlas, Kraken, Arachne) for the new season?\n\nOK = clear it\nCancel = keep it');
  S.players.forEach(p=>{p.tcTier='Bronze';p.tcRank=null;p.rewards={};if(clearBoss)SEASON.forEach(([k])=>p.season[k]=[null,null])});
  save();render();
}
function newWeek(){
  if(!confirm('Start a new week?\n\n• Legion Hunt: Current → Previous, Current cleared\n• Titan Challenge: this week damage cleared (EWT resets)\n• Weekly Total Loot is cleared\n• Players whose TC result is Advance are recorded as having received that tier reward (one time only)\n\nTip: take a 💾 Backup first if unsure.'))return;
  S.players.forEach((p,i)=>{
    const tr=tierOutcome(p.tcTier,p.tcRank);if(tr&&tr.out==='Advance'&&tr.pts)p.rewards[p.tcTier]=true;
    LEGION.forEach(([k])=>{const a=p.legion[k];if(a[1]!=null)a[0]=a[1];a[1]=null});
    SEASON.forEach(([k])=>{const a=p.season[k];if(a[1]!=null)a[0]=a[1];a[1]=null});
    p.loot=null;
  });
  save();render();
}
function dl(name,mime,data){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:mime}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function exportJson(){dl('legion-tracker-backup-'+todayStr()+'.json','application/json',JSON.stringify(S,null,1))}
function exportCsv(){
  const q=v=>{v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const head=['Player','Titan BP (M)','Max PP','CC Level','Rare Earths','Total Weekly Loot','TC Tier','TC Rank',
    ...DAILY.map(d=>d[1]),
    ...LEGION.flatMap(l=>[l[1]+' Prev',l[1]+' Curr']),
    ...SEASON.flatMap(l=>[l[1]+' This Week',l[1]+' EWT']),
    ...SETS.map(s=>s[1]+' pieces (of 4)'),
    ...S.shops.map(x=>x.name+' Points')];
  const rows=S.players.map(p=>[p.name,p.bp,p.pp,p.cc,p.rare,p.loot,p.tcTier,p.tcRank,
    ...DAILY.map(([k])=>p.daily[k]?'Done':''),
    ...LEGION.flatMap(([k])=>p.legion[k]),
    ...SEASON.flatMap(([k])=>{const v=p.season[k][1];return [v,v==null?'':Math.round(v*14*100)/100]}),
    ...SETS.map(([k])=>p.gear[k].filter(Boolean).length),
    ...S.shops.map(x=>p.points[x.id])]);
  dl('Legion_Report_'+todayStr()+'.csv','text/csv;charset=utf-8','﻿'+[head,...rows].map(r=>r.map(q).join(',')).join('\r\n'));
}

load();render();
/* installable + works offline + ask the browser to keep saved data */
if(location.protocol.startsWith('http')){
  if('serviceWorker' in navigator)navigator.serviceWorker.register('legion-sw.js').catch(()=>{});
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(_){}
}
