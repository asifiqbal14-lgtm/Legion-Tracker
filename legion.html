<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legion Tracker</title>
<link rel="manifest" href="legion-manifest.json">
<meta name="theme-color" content="#0b0e14">
<link rel="icon" href="legion-icon-192.png">
<link rel="apple-touch-icon" href="legion-icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#0e1117; --panel:#161b24; --panel2:#1d2430; --line:#2a3342; --text:#e6e9ef; --muted:#8b95a7;
  --accent:#4f9cff; --red:#ef4444; --red-bg:#3a1619; --green:#22c55e; --green-bg:#12381f; --amber:#f5b942;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,Segoe UI,Roboto,sans-serif}
body{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{flex:none;z-index:30;background:#0b0e14;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
header h1{font-size:17px;margin:0 8px 0 0;letter-spacing:.3px}
header .date{color:var(--muted);font-size:13px}
.sp{flex:1}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:6px 12px;border-radius:7px}
button:hover{border-color:var(--accent)}
.btn-accent{background:#1d3b66;border-color:#2c5ca0}
.btn-danger:hover{border-color:var(--red)}
nav{display:flex;gap:10px;padding:12px 16px;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--bg);flex:none;z-index:20}
nav button{border-radius:999px;border:2px solid var(--tc);background:#161b24;color:var(--tc);padding:10px 20px;font-size:16px;font-weight:700}
nav button:hover{background:var(--tc);color:#0b0e14}
nav button.on{background:var(--tc);color:#0b0e14;box-shadow:0 3px 12px rgba(0,0,0,.45)}
main{flex:1;min-height:0;display:flex;flex-direction:column;overflow:auto;padding:14px 16px 16px}
main>*{flex:none}
.banner{background:#3b2f10;border:1px solid #6b5316;color:#ffdf8a;padding:10px 14px;border-radius:8px;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hint{color:var(--muted);font-size:12.5px;margin:0 0 10px}
.wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);flex:1 1 auto!important;min-height:200px}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:center;white-space:nowrap}
th{background:var(--panel2);position:sticky;top:0;z-index:5;font-weight:600;font-size:12.5px}
th.grp{top:0}
thead tr:nth-child(2) th{top:30px}
tbody td:first-child,thead tr:first-child th:first-child{position:sticky;left:0;z-index:6;background:var(--panel2);text-align:left;font-weight:600;width:var(--namew,110px);min-width:var(--namew,110px);max-width:var(--namew,110px);overflow:hidden;text-overflow:ellipsis}
thead tr:first-child th:first-child{z-index:8}
tbody tr:hover td{background:#1a2230}
tbody tr:hover td:first-child{background:#222c3c}
input[type=number],input[type=text],select{background:#0e1219;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 6px;font:inherit;width:84px;text-align:center}
input[type=text].name{width:100%;text-align:left}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px #4f9cff33}
input[type=number]::-webkit-inner-spin-button{opacity:.4}
.tg{min-width:58px;padding:5px 8px;border-radius:7px;font-weight:700;border:1px solid var(--red);background:var(--red-bg);color:#ff9a9a}
.tg.on{border-color:var(--green);background:var(--green-bg);color:#7dffa8}
.tg.sm{min-width:44px;padding:3px 6px}
.rk{color:var(--accent);font-weight:700;margin-right:4px}
.rank{display:flex;gap:4px;align-items:center;justify-content:center}
.rank button{padding:4px 9px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.pills button.on{background:#1d3b66;border-color:var(--accent)}
.pills.shops button.on{background:#12381f;border-color:var(--green)}
td.wc{white-space:normal;text-align:left;min-width:230px}
.ib{display:inline-block;background:var(--green-bg);border:1px solid var(--green);color:#7dffa8;border-radius:99px;padding:2px 9px;margin:2px;font-size:12.5px}
.ib.next{background:#2a2a14;border-color:#6b5316;color:var(--amber)}
td input.it{width:100%;text-align:left}
.cnt{font-variant-numeric:tabular-nums;color:var(--muted)}
.cnt.full{color:var(--green);font-weight:700}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600}
.b-adv{background:var(--green-bg);color:#7dffa8;border:1px solid var(--green)}
.b-same{background:#2a2a14;color:var(--amber);border:1px solid #6b5316}
.b-dem{background:var(--red-bg);color:#ff9a9a;border:1px solid var(--red)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
.card h3{margin:0 0 8px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.card table th,.card table td{padding:4px 5px;border-right:none}
.card table td:first-child,.card table th:first-child{position:static;background:transparent;min-width:0;width:auto;max-width:none;overflow:visible}
.card .wrap2{border:none}
.sep td,.sep th{border-top:2px solid var(--line)}
.toast{position:fixed;bottom:16px;right:16px;background:#12381f;border:1px solid var(--green);color:#9dffc0;padding:6px 12px;border-radius:8px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
.calc{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:12px}
.calc select,.calc input{width:auto;min-width:90px}
.leg{display:flex;gap:14px;color:var(--muted);font-size:12.5px;margin:0 0 8px;flex-wrap:wrap}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
.rm{padding:2px 8px;color:var(--muted)}
.rm:hover{color:var(--red);border-color:var(--red)}
.bar{height:8px;background:#0e1219;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .2s}
.bar i.full{background:var(--green)}
.irow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center}
.irow:last-child{border-bottom:none}
.barrow{grid-column:1/-1}
.shl{color:var(--muted);font-size:12.5px;margin:6px 0 2px}
.fcard{border-color:#6b5316}
.fhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:6px 0 8px}.fpct{font-size:22px;font-weight:900}
.fbar{display:flex;height:22px;background:#0e1219;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.fbar.fthick{height:32px;border-radius:12px}.fbar i.full{background:var(--green)}
.fbar i{display:block;height:100%;transition:width .2s}.fbar i.own{background:var(--green)}.fbar i.buy{background:#4f9cff}
.fleg{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:8px;font-size:13px}.fleg .dot{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.dot.own{background:var(--green)}.dot.buy{background:#4f9cff}.fsum{margin-top:6px;font-size:14px}
.tgbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}.tgbar input[type=text]{width:150px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.tile{background:#0e1219;border:2px solid var(--tc);border-radius:16px;padding:12px 10px;text-align:center}
.tile .tq{font-size:26px;font-weight:800;color:var(--tc);line-height:1.1}
.tile .tn{font-weight:700;margin-top:4px}
.tile .ts{color:var(--muted);font-size:12px;margin-top:4px}
.frow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.frow select{width:auto;min-width:80px}
#view .card{margin-bottom:12px}
#view .cards .card{margin-bottom:0}
.rsz{position:absolute;right:0;top:0;bottom:0;width:16px;cursor:col-resize;touch-action:none;display:flex;align-items:center;justify-content:center}
.rsz::after{content:'';width:4px;height:55%;border-radius:3px;background:var(--accent);opacity:.8}
.ewt{color:var(--amber);font-weight:700}
.rwwrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:16px}
.rwb{min-width:68px;padding:4px 8px;border-radius:7px;font-weight:700;border:1px solid var(--line);background:var(--panel2);color:var(--muted)}
.rwb.on{border-color:var(--green);background:var(--green-bg);color:#7dffa8}
.stiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:6px}
.stile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:var(--bg);color:var(--tx);border:3px solid var(--bc);border-radius:14px;padding:10px 10px 12px;font-weight:600;min-height:112px;cursor:pointer}
.stile:hover{border-color:var(--bc);filter:brightness(1.05)}
.stile .trow{display:flex;gap:8px;align-items:flex-start;width:100%}
.stile .cbx{flex:none;width:22px;height:22px;border:3px solid var(--bc);border-radius:6px;background:#fff;color:#fff;font-size:15px;line-height:16px;text-align:center;font-weight:900}
.stile.sel .cbx{background:var(--bc)}
.stile .ttl{font-size:15px;font-weight:800;line-height:1.2}
.stile .big{font-size:26px;font-weight:900;line-height:1.1;margin-top:2px}
.stile .sub{font-size:12.5px;opacity:.8}
.stile .pill{display:inline-block;background:var(--bc);color:#fff;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700}
.stile.sel{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--bc)}
.buybar{position:sticky;top:0;z-index:12;background:#0f141d;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:12px;box-shadow:0 6px 16px rgba(0,0,0,.55)}
.bbmain{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;border-left:5px solid var(--bc);padding-left:10px}
.stepper{display:flex;gap:8px;align-items:center}
.stepper button{padding:2px 12px;font-size:18px}
.bbbtns{display:flex;gap:8px;margin-left:auto}
button.buy{background:#12381f;border-color:var(--green);color:#9dffc0;font-weight:800;padding:8px 16px}
.bblast{margin-top:8px}
.bblast button{padding:2px 10px;margin-left:6px}
.igroups{display:flex;flex-direction:column;gap:10px;padding:6px}
.igroup{display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:#0e1219;border:1px solid var(--line);border-radius:14px}
.itile{width:80px;min-height:96px;border:2px solid var(--ic);border-radius:12px;background:#0f141d;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.ichip{flex:none;width:30px;height:30px;border-radius:9px;background:var(--ic);display:inline-flex;align-items:center;justify-content:center;font-size:18px;line-height:1}
.inm{font-size:11.5px;font-weight:800;line-height:1.15;word-break:break-word}
.itot{font-size:15px;font-weight:900;color:var(--ic);margin-top:auto}
.stile.sm{width:80px;min-height:96px;padding:6px 6px 7px;border-width:2px;border-radius:12px;gap:2px}
.stile.sm .trow{gap:5px;align-items:center}
.stile.sm .cbx{width:16px;height:16px;border-width:2px;border-radius:4px;font-size:11px;line-height:11px}
.stile.sm .ttl{font-size:11.5px;line-height:1.1}
.stile.sm .big{font-size:19px;margin-top:0}
.stile.sm .pill{font-size:10.5px;padding:1px 5px;border-radius:5px}
.stile.sm .sub{font-size:10px}
.stile.sm.sel{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--bc)}
td input.icn{width:56px;text-align:center}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px;margin-bottom:14px}
.pgrid .stile.sm{width:auto;min-width:0}
.tgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-bottom:14px}
.tgrid .stile.sm{width:auto;min-width:0;min-height:62px;padding:5px 4px}
.tgrid .stile .sub{font-size:9.5px;line-height:1.1;word-break:break-word}
.ptile .trow{justify-content:space-between;align-items:center}
.pcount{font-size:19px;font-weight:900;line-height:1}
.ptile .ttl{font-size:10.5px;overflow-wrap:anywhere}
.ptile .chips{display:flex;flex-wrap:wrap;gap:2px;margin-top:auto}
.chip{background:var(--bc);color:#fff;border-radius:5px;padding:0 4px;font-size:10px;font-weight:800}
.chip.hit{background:#16a34a}
.tchips{display:flex;gap:6px;flex-wrap:wrap}
.tchip{padding:4px 12px;font-size:15px;font-weight:800;border-radius:9px;border:2px solid var(--line);background:var(--panel2)}
.tchip.hit{border-color:var(--green);background:var(--green-bg);color:#7dffa8}

.pms-inv{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-bottom:12px}
.icard{background:var(--panel);border:2px solid var(--bc,var(--line));border-radius:12px;padding:10px}
.icard h4{margin:0 0 8px;font-size:13px;color:var(--bc)}
.irow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0;font-size:13px}
.irow input{width:84px;text-align:right}
.pbar{position:relative;height:17px;background:#0b0f15;border-radius:9px;overflow:hidden;border:1px solid var(--line);margin-top:4px}
.pbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#2563eb,#38bdf8)}
.pbar.up i{background:linear-gradient(90deg,#a21caf,#f472b6)}
.pbar.rdy i{background:linear-gradient(90deg,#16a34a,#4ade80)}
.pbar span{position:relative;z-index:1;display:block;text-align:center;font-size:11px;font-weight:700;line-height:15px;text-shadow:0 0 3px #000}
.pgrid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.pcard{background:var(--panel);border:2px solid var(--bc);border-radius:11px;padding:8px}
.pcard.sel{box-shadow:0 0 0 3px #fff8}
.pcard .pname{display:block;width:100%;text-align:left;font-weight:800;font-size:14px;background:var(--bc);color:#fff;border:0;padding:4px 8px;border-radius:7px}
.pcard small{color:var(--muted);display:block;margin-top:3px}
.rar{font-size:10px;font-weight:800;padding:0 5px;border-radius:5px;background:#0006;margin-left:4px}
.r-N{--bc:#64748b}.r-R{--bc:#2563eb}.r-SR{--bc:#9333ea}.r-SSR{--bc:#d97706}
.pshr{display:flex;align-items:center;gap:6px;margin-top:5px;font-size:12px}.pshr input{width:70px;text-align:right}
.pdet{scroll-margin-top:8px;background:var(--panel);border:2px solid var(--bc);border-radius:12px;padding:12px;margin-bottom:12px}
.pdet .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.need{display:flex;justify-content:space-between;font-size:12.5px;margin-top:6px}
.need b.ok{color:#fff}.need b.no{color:#ff4d4d}
.rqs{display:flex;flex-wrap:wrap;gap:3px 8px;margin:2px 0 4px;font-size:11.5px;font-weight:700}.rq.ok{color:#fff}.rq.no{color:#ff4d4d}
.fstock{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:2px 14px;margin-top:10px}
.top5{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px;margin-bottom:12px}
.top5 button{display:block;width:100%;text-align:left;padding:4px 6px;margin-top:5px;border-radius:8px}
@media (max-width:700px){.cards{grid-template-columns:1fr}}
@media (max-width:700px),(max-height:620px){
  header{padding:6px 10px;gap:6px;flex-wrap:nowrap;overflow-x:auto}
  header h1{font-size:14px;white-space:nowrap;margin:0}
  header .date{display:none}
  header button{white-space:nowrap;padding:5px 9px;font-size:13px}
  nav button{white-space:nowrap;padding:9px 16px;font-size:15px}
  nav{flex-wrap:nowrap;overflow-x:auto;padding:8px 10px;gap:8px}
  main{padding:8px 10px}
  .hint{display:none}
  body.typing header,body.typing nav,body.typing .banner{display:none}
}

/* ================= GLASS SKIN (v28) ================= */
:root{
  --bg:#080b16; --panel:rgba(255,255,255,.055); --panel2:rgba(255,255,255,.085); --line:rgba(255,255,255,.13);
  --text:#eef1fb; --muted:#9aa6c4; --accent:#6aa8ff;
  --glass:rgba(255,255,255,.06); --glass2:rgba(255,255,255,.10); --solid:#121829; --solid2:#18203a;
  --r:20px; --shadow:0 10px 30px rgba(0,0,0,.38);
}
html,body{background:#070a14}
body::before{content:"";position:fixed;inset:-10%;z-index:-1;pointer-events:none;
  background:
   radial-gradient(520px 420px at 12% 8%,rgba(99,102,241,.38),transparent 70%),
   radial-gradient(560px 460px at 92% 14%,rgba(236,72,153,.26),transparent 70%),
   radial-gradient(620px 520px at 78% 96%,rgba(20,184,166,.26),transparent 70%),
   radial-gradient(520px 420px at 6% 88%,rgba(56,189,248,.22),transparent 70%),
   linear-gradient(160deg,#0a0e1d,#070a14 60%)}
header{background:rgba(12,16,32,.55);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.28)}
header h1{background:linear-gradient(90deg,#fff,#a5b4fc 60%,#f0abfc);-webkit-background-clip:text;background-clip:text;color:transparent}
nav{background:transparent;border-bottom:none;padding:12px 16px 6px;gap:10px}
nav button{border:1px solid color-mix(in srgb,var(--tc) 55%,transparent);background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.03));
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:#fff;border-radius:999px;padding:10px 20px;font-weight:700;
  box-shadow:0 6px 18px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.28);transition:transform .15s,box-shadow .15s,background .2s}
nav button:hover{background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 55%,transparent),color-mix(in srgb,var(--tc) 22%,transparent));color:#fff;transform:translateY(-1px)}
nav button.on{background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 95%,#fff 8%),color-mix(in srgb,var(--tc) 70%,#000));color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45);
  box-shadow:0 8px 24px color-mix(in srgb,var(--tc) 45%,transparent),inset 0 1px 0 rgba(255,255,255,.55)}
button,.btn{border-radius:999px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.04));color:var(--text);padding:7px 14px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2);transition:transform .12s,border-color .15s,background .15s}
button:hover{border-color:rgba(255,255,255,.4);background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.07))}
button:active{transform:scale(.97)}
.btn-accent{background:linear-gradient(180deg,#5b9bff,#3568d4)!important;border-color:rgba(255,255,255,.35)!important;color:#fff;box-shadow:0 6px 16px rgba(53,104,212,.4),inset 0 1px 0 rgba(255,255,255,.4)}
.btn-danger:hover{border-color:#fb7185;background:rgba(251,113,133,.18)}
input[type=number],input[type=text],select{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:14px;padding:7px 10px;color:var(--text);
  box-shadow:inset 0 2px 6px rgba(0,0,0,.28);transition:border-color .15s,box-shadow .15s,background .15s}
select option,select optgroup{background:#121829;color:#eef1fb}
input:focus,select:focus{background:rgba(255,255,255,.11);border-color:#7db3ff;box-shadow:0 0 0 3px rgba(106,168,255,.28),inset 0 2px 6px rgba(0,0,0,.2)}
::placeholder{color:rgba(190,200,225,.45)}
main{padding:10px 16px 18px}
.wrap,.rwwrap{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.12)}
th{background:#171f38}
th,td{border-bottom:1px solid rgba(255,255,255,.07);border-right:1px solid rgba(255,255,255,.05)}
tbody td:first-child,thead tr:first-child th:first-child{background:#141b31}
tbody tr:hover td{background:rgba(255,255,255,.05)}

  background:linear-gradient(145deg,hsl(var(--h) 85% 62%),hsl(calc(var(--h) + 40) 80% 40%));box-shadow:0 3px 8px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.55);text-shadow:0 1px 2px rgba(0,0,0,.4)}

<body>
<header>
  <h1>⚔ Legion Daily Activity Tracker <small style="color:#7dffa8;font-weight:400">v31</small></h1>
  <span class="date" id="dateLbl"></span>
  <span class="sp"></span>
  <button id="btnDay" title="Reset all daily Done buttons to red">🌅 New Day</button>
  <button id="btnWeek" title="Move Current Week damage to Previous Week">📅 New Week</button>
  <button id="btnSeason" title="Start a new 3-month season: everyone back to Bronze">🌋 New Season</button>
  <button id="btnCsv">⬇ Excel (CSV)</button>
  <button id="btnExp">💾 Backup</button>
  <button id="btnImp">📂 Restore</button>
  <input type="file" id="fileImp" accept=".json" hidden>
</header>
<nav id="tabs"></nav>
<main id="view"></main>
<div class="toast" id="toast">Saved</div>

<script>
/* ============ CONFIG ============ */
const DAILY=[['mission','Mission Daily'],['lh','LH'],['tc','TC'],['camp','Camp'],['assist','Play Assist'],['endless','Endless'],['drone','Drone'],['sentinel','Sentinel'],['md','MD'],['chips','Chips'],['tasking','Tasking']];
const DAILY_GROUPS=[
 {label:'🌙 Active 9 PM',color:'#a78bfa',all:true,cols:[['mission','#99f6e4'],['lh','#c4b5fd'],['tc','#93c5fd'],['camp','#a5b4fc'],['drone','#7dd3fc'],['sentinel','#d8b4fe'],['md','#f0abfc']]},
 {label:'🌅 Active 12:00 AM',color:'#fbbf24',all:true,cols:[['assist','#fdba74'],['endless','#fcd34d'],['chips','#fca5a5']]},
 {label:'Other',color:'#94a3b8',cols:[['tasking','#cbd5e1']]}
];
const LEG_COL=['#fca5a5','#fdba74','#fde68a','#bef264','#86efac','#67e8f9','#c4b5fd'];
const LEGION=[['icarus','Icarus'],['anansi','Anansi'],['hydra','Hydra'],['pegasus','Pegasus'],['charon','Charon'],['jormungand','Jormungand'],['chimera','Chimera']];
const SEASON=[['atlas','Atlas'],['kraken','Kraken'],['arachne','Arachne']];
const SETS=[['simple','Simple'],['conq','Conquerer'],['dest','Destroyer'],['thor','Thor'],['optimus','Optimus Prime'],['mega','Megatron']];
const PIECES=['Main Gun','Wing Gun','Missile','Armor'];
const TIERS=[ // name, [rankRange,outcome] ..., tierChange, reward
 ['Bronze',[['1-30','Advance'],['31-50','Unchanged']],'Bronze to Silver',5000],
 ['Silver',[['1-20','Advance'],['21-35','Unchanged'],['36-50','Demotion to Lower Tier']],'Silver to Gold',7500],
 ['Gold',[['1-20','Advance'],['21-35','Unchanged'],['36-50','Demotion to Lower Tier']],'Gold to Platinum',10000],
 ['Platinum',[['1-15','Advance'],['16-35','Unchanged'],['36-50','Demotion to Lower Tier']],'Platinum to Diamond',12500],
 ['Diamond',[['1-10','Advance'],['11-25','Unchanged'],['26-50','Demotion to Lower Tier']],'Diamond to Masters',18750],
 ['Master',[['1-10','Advance'],['11-25','Unchanged'],['26-50','Demotion to Lower Tier']],'Master to Legend',25000],
 ['Legend',[['1-10','Unchanged'],['11-50','Demotion to Lower Tier']],'—',null]
];
const KEY='legionTrackerV1';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const SHOP_DEFS=[['titan','Titan Shop'],['star','Star Scramble Shop'],['planet','Planet War Shop'],['battle','Battlefield Shop'],['recycle','Recycling Shop']];
function defaultShops(){
  const mk=(id,name,items)=>({id,name,items:items.map(([n,c])=>({id:uid(),name:n,cost:c}))});
  return SHOP_DEFS.map(([id,name])=>mk(id,name,
    id==='titan'?[['Main Gun',11000],['Wing Gun',8200],['Missile',8200],['Armor Shield',8200],['Titan Fighter Shards',750]]
   :id==='planet'?[['Main Gun',33000],['Wing Gun',24600],['Missile',24600],['Armor Shield',24600],['Titan Fighter Shards',2200]]
   :[]));
}
function migrate(){
  if(!S.shops)S.shops=[];
  if(S.focus==null)S.focus='';
  if(S.focusMonth==null)S.focusMonth='';
  tgFix();
  if(!S.pms)S.pms={};
  defaultShops().forEach(d=>{if(!S.shops.some(x=>x.id===d.id))S.shops.push(d)});
  if(!S.pmsFix1){S.pmsFix1=true;S.players.forEach(p=>{if(/^\s*maverick\s*$/i.test(p.name)){const m=S.pms[p.id];if(m&&m.p&&m.p.Skuld&&(+m.p.Skuld.up||0)<10)m.p.Skuld.up=10}})}
  S.players.forEach(p=>{
    if(!p.points)p.points={};
    if(!p.bought)p.bought={};
    if(!p.rewards)p.rewards={};
    if(!p.log)p.log=[];
    if(!p.focus)p.focus={item:'',qty:1};
    DAILY.forEach(([k])=>{if(p.daily[k]==null)p.daily[k]=false});
  });
}

/* ============ STATE ============ */
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function blankPlayer(name){
  const p={id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),name,cc:null,pp:null,bp:null,rare:null,ss:null,loot:null,tcTier:'',tcRank:null,daily:{},legion:{},season:{},gear:{},focus:{item:'',qty:1},bought:{},log:[],rewards:{}};
  DAILY.forEach(([k])=>p.daily[k]=false);
  LEGION.forEach(([k])=>p.legion[k]=[null,null]);
  SEASON.forEach(([k])=>p.season[k]=[null,null]);
  SETS.forEach(([k])=>p.gear[k]=[false,false,false,false]);
  p.points={};
  return p;
}
/* Seed = data from Daily_Activity_Report_WF_Updated_23-10-26.xlsx */
function seed(){
  const R=[ // name,cc,pp,bp,rare,loot,arachne, legion [prev,cur]x7 (icarus,anansi,hydra,pegasus,charon,jormungand,chimera)
   ['Maverick',45,1300,35,572,52,60,[[3300,3600],[3200,3600],[3900,null],[2400,3000],[20,null],[20,null],[4500,4700]]],
   ['DaFlawless',45,1066,30,101,40,40,[[1900,2400],[1800,2000],[1700,null],[1400,2300],[7.5,null],[7.5,null],[2000,2500]]],
   ['Blackhawk',45,970,22,101,49,40,[[1200,null],[1300,1500],[1100,null],[1100,null],[7.1,null],[null,null],[1500,1800]]],
   ['War Machine',30,749,7,null,21,null,[[1300,1300],[1100,1400],[1000,null],[944,1200],[0.8,null],[null,null],[1300,1300]]],
   ['Knightrider',37,802,11,480,47,null,[[1100,null],[1300,1300],[1100,null],[787,1290],[1.4,null],[null,null],[1200,1600]]],
   ['BruteNose',24,null,5.8,72,7,2.4,[[1100,null],[1100,1400],[1000,null],[898,null],[null,null],[null,null],[1400,1300]]],
   ['Maverick Bilal',25,781,9,69,10,null,[[1100,null],[1100,null],[1000,null],[856,1000],[0.7,null],[null,null],[1100,null]]],
   ['Kill Machine',33,null,14,328,32,12,[[1100,null],[1100,1300],[1000,null],[862,1100],[2.2,null],[2.2,null],[1000,null]]],
   ['EntityX',null,674,null,null,null,null,[[335,442],[566,null],[299,null],[406,null],[null,null],[null,null],[631,null]]],
   ['JetElite',null,null,null,null,null,null,[[4.3,null],[5,null],[10.4,null],[9.7,null],[null,null],[null,null],[7.4,null]]]
  ];
  return R.map(r=>{
    const p=blankPlayer(r[0]);
    p.cc=r[1];p.pp=r[2];p.bp=r[3];p.rare=r[4];p.loot=r[5];
    p.season.arachne=[null,r[6]];
    LEGION.forEach(([k],i)=>p.legion[k]=r[7][i].slice());
    if(['Maverick','DaFlawless','Blackhawk','War Machine','Knightrider','BruteNose','Maverick Bilal','Kill Machine'].includes(r[0]))
      DAILY.forEach(([k])=>p.daily[k]=(k!=='md'));
    return p;
  });
}
let S;
function load(){
  try{const raw=localStorage.getItem(KEY);if(raw){S=JSON.parse(raw);migrate();return}}catch(e){}
  S={date:todayStr(),players:seed(),shops:defaultShops()};migrate();
}
let saveWarned=false;
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S));toast('Saved')}
  catch(e){if(!saveWarned){saveWarned=true;alert('Browser storage is unavailable here, so changes will be lost on reload. Use 💾 Backup regularly.')}}
}
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),800)}
const P=id=>S.players.find(p=>p.id===id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const val=v=>v==null?'':v;

/* ============ TABS ============ */

/* ===== glass skin helpers: player avatars + shop icons ===== */
function avHue(n){let h=0;for(const c of String(n||'?'))h=(h*31+c.charCodeAt(0))%360;return h}
function av(name,sz){const t=String(name||'?').trim();const ch=(t.match(/[A-Za-z0-9]/)||['?'])[0].toUpperCase(),h=avHue(t);
  return `<span class="av" style="--h:${h};${sz?'--s:'+sz+'px;':''}">${esc(ch)}</span>`}
const SHOP_EMO={titan:'🤖',star:'⭐',planet:'🪐',battle:'⚔️',recycle:'♻️'};
const SHOP_EMO_FALL=['🛍️','🏪','💠','🎁'];
function shopEmo(sh){return SHOP_EMO[sh.id]||SHOP_EMO_FALL[Math.max(0,S.shops.indexOf(sh))%SHOP_EMO_FALL.length]}
const TABS=[['daily','✅ Daily Tasks','#22c55e'],['players','👤 Players & Power','#4f9cff'],['legion','🐉 Legion Hunt','#a78bfa'],['season','🌋 Titan Challenge','#fb923c'],['targets','🎯 Legion Targets','#f472b6'],['shops','🛒 Shops & Resources','#2dd4bf'],['pms','🧑‍✈️ Pilots (PMS)','#38bdf8']];
let tab=(()=>{try{return localStorage.getItem(KEY+'_tab')||'daily'}catch(e){return 'daily'}})();
if(!TABS.some(t=>t[0]===tab))tab='daily';

function renderTabs(){
  document.getElementById('tabs').innerHTML=TABS.map(([k,l,c])=>`<button data-tab="${k}" class="${k===tab?'on':''}" style="--tc:${c}">${l}</button>`).join('');
}
function render(){
  document.getElementById('dateLbl').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'short',year:'numeric'})+'  ·  Tracking day: '+S.date;
  renderTabs();
  const v=document.getElementById('view');
  const oldW=v.querySelector('.wrap'),sx=oldW?oldW.scrollLeft:0,sy=oldW?oldW.scrollTop:0,mt=v.scrollTop,sameTab=v.dataset.shown===tab;
  const banner=S.date!==todayStr()?`<div class="banner">📆 The day has changed since your last session (${S.date}). <button class="btn-accent" id="bnDay">Start new day (reset Done buttons)</button> <button id="bnKeep">Keep as is</button></div>`:'';
  v.innerHTML=banner+({daily:vDaily,players:vPlayers,legion:vLegion,season:vSeason,targets:vTargets,pms:vPms,gear:vGear,shops:vShops,tier:vTier}[tab])();
  v.dataset.shown=tab;
  if(tab==='pms')pmsApplyQ();
  if(tab==='targets')mountBoard();
  setTabOrder();
  document.querySelectorAll('#view .wrap thead tr:first-child th:first-child').forEach(th=>{const d=document.createElement('span');d.className='rsz';d.title='Drag to resize';th.appendChild(d)});
  if(sameTab){const w=v.querySelector('.wrap');if(w){w.scrollLeft=sx;w.scrollTop=sy}v.scrollTop=mt}
}

/* Keyboard Next / Tab goes DOWN the column instead of right */
function setTabOrder(){
  let n=1;
  document.querySelectorAll('#view table').forEach(t=>{
    const rows=[...t.querySelectorAll('tbody tr')];if(!rows.length)return;
    const cols=Math.max(...rows.map(r=>r.children.length));
    for(let c=0;c<cols;c++)rows.forEach(r=>{const td=r.children[c];if(!td)return;td.querySelectorAll('input,select').forEach(el=>{el.tabIndex=n++})});
  });
}
/* ============ VIEWS ============ */
function tg(on,attrs,txt){return `<button class="tg ${on?'on':''}" ${attrs}>${on?'✓ Done':(txt||'✕')}</button>`}
function vDaily(){
  const lab=k=>DAILY.find(d=>d[0]===k)[1];
  const span=g=>g.cols.length+(g.all?1:0);
  let h=`<p class="hint">Click a button to flip it: <b style="color:#ff9a9a">red = not done</b> → <b style="color:#7dffa8">green = done</b>. Click again to undo. Each group has its own “All” button that marks every activity of that group.</p>
  <div class="wrap"><table><thead><tr><th rowspan="2">Player</th>${DAILY_GROUPS.map(g=>`<th colspan="${span(g)}" style="background:${g.color};color:#10131a;text-align:left"><span style="position:sticky;left:calc(var(--namew,110px) + 10px);display:inline-block;white-space:nowrap">${g.label}</span></th>`).join('')}<th rowspan="2">Progress</th></tr>
  <tr>${DAILY_GROUPS.map(g=>g.cols.map(([k,c])=>`<th style="background:${c};color:#10131a">${lab(k)}</th>`).join('')+(g.all?`<th style="background:${g.color};color:#10131a">All</th>`:'')).join('')}</tr></thead><tbody>`;
  S.players.forEach((p,i)=>{
    const n=DAILY.filter(([k])=>p.daily[k]).length;
    h+=`<tr><td><span class="rk">#${i+1}</span> ${esc(p.name)}</td>${DAILY_GROUPS.map((g,gi)=>g.cols.map(([k,c])=>`<td style="background:${c}">${tg(p.daily[k],`data-tg="${p.id}|daily|${k}"`)}</td>`).join('')+(g.all?`<td style="background:${g.color}"><button class="tg sm ${g.cols.every(([k])=>p.daily[k])?'on':''}" data-allg="${p.id}|${gi}">All</button></td>`:'')).join('')}
    <td class="cnt ${n===DAILY.length?'full':''}">${n}/${DAILY.length}</td></tr>`;
  });
  return h+'</tbody></table></div>';
}
function vPlayers(){
  const num=(p,f,extra)=>`<td><input type="text" inputmode="decimal" enterkeyhint="enter" data-num="1" min="0" step="any" value="${val(p[f])}" data-in="${p.id}|${f}" ${extra||''}></td>`;
  let h=`<p class="hint">Type a number and it saves automatically. CC max is 84. PP = Pull Power. Titan BP is overall power (million) with all Titan gear. Use ▲▼ (or type a number in Rank, last column) to reorder players by ranking; every tab follows this order. Drag the bar on the edge of the Player ID header to resize that column.</p>

const tgNewId=()=>'L'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const tgMk=(name,players)=>({id:tgNewId(),name:name||'Legion',players:players||[],assign:{},hit:{}});
function tgFix(){
  let T=S.targets;
  if(!T||typeof T!=='object'||Array.isArray(T))T=S.targets={};
  if(!Array.isArray(T.legions)){
    const L=tgMk('Legion 1',S.players.map(p=>({id:p.id,name:p.name})));
    if(T.assign&&typeof T.assign==='object')L.assign=T.assign;
    if(T.hit&&typeof T.hit==='object')L.hit=T.hit;
    S.targets={legions:[L],cur:L.id};T=S.targets;
  }else{
    T.legions=T.legions.filter(l=>l&&typeof l==='object');
    T.legions.forEach((l,k)=>{
      if(!l.id)l.id=tgNewId();
      if(typeof l.name!=='string'||!l.name)l.name='Legion '+(k+1);
      if(!Array.isArray(l.players))l.players=[];
      l.players=l.players.map((x,n)=>typeof x==='string'?{id:'p'+tgNewId()+n,name:x}:x).filter(x=>x&&x.name!=null).map((x,n)=>({id:x.id||('p'+tgNewId()+n),name:String(x.name),note:x.note||''}));
      if(!l.assign||typeof l.assign!=='object'||Array.isArray(l.assign))l.assign={};
      if(!l.hit||typeof l.hit!=='object'||Array.isArray(l.hit))l.hit={};
    });
    if(!T.legions.length){const L=tgMk('Legion 1',S.players.map(p=>({id:p.id,name:p.name})));T.legions.push(L)}
  }
  if(!T.legions.some(l=>l.id===T.cur))T.cur=T.legions[0].id;
}
const tgCur=()=>{tgFix();return S.targets.legions.find(l=>l.id===S.targets.cur)||S.targets.legions[0]};

=>{S.sel=(S.sel===p.id?null:p.id);save();render()};\n    pg.appendChild(t);\n  });\n\n  // targets\n  const tg=$('tgrid');tg.innerHTML='';\n  labels().forEach(l=>{\n    const t=el('div','ttile'+(sp&&sp.t.includes(l)?' mine':''));\n    t.style.setProperty('--tc',rowCol(l));t.style.setProperty('--tt',rowTxt(l));\n    const pl=tplayers(l);\n    const lab=el('div','tlabel',l);lab.appendChild(el('small',null,pl.length?pl.length+' hit':''));\n    t.appendChild(lab);\n    const ch=el('div','chips');\n    pl.forEach(p=>ch.appendChild(chip(p.name,pcol(p))));\n    t.appendChild(ch);\n    t.onclick=()=>{\n      const s=selPlayer();\n      if(!s){toast('Select a player first');return}\n      const i=s.t.indexOf(l);\n      if(i>=0)s.t.splice(i,1);else s.t.push(l);\n      save();render();\n    };\n    tg.appendChild(t);\n  });\n  renderLookup();\n}\n\nfunction renderLookup(){\n  const sp=$('selPlayer'),st=$('selTarget');\n  const pv=sp.value,tv=st.value;\n  sp.innerHTML='';st.innerHTML='';\n  const o0=el('option',null,'— Pick a player to see his targets —');o0.value='';sp.appendChild(o0);\n  S.players.forEach(p=>{const o=el('option',null,p.name);o.value=p.id;sp.appendChild(o)});\n  const t0=el('option',null,'— Pick a target to see who hits it —');t0.value='';st.appendChild(t0);\n  labels().forEach(l=>{const o=el('option',null,l);o.value=l;st.appendChild(o)});\n  sp.value=[...sp.options].some(o=>o.value===pv)?pv:'';\n  st.value=[...st.options].some(o=>o.value===tv)?tv:'';\n  showLookup();\n}\nfunction showLookup(){\n  const po=$('outPlayer'),to=$('outTarget');po.innerHTML='';to.innerHTML='';\n  const p=S.players.find(x=>String(x.id)===$('selPlayer').value);\n  if(p){const m=ptargets(p);if(!m.length)po.appendChild(el('span','empty','No targets assigned'));m.forEach(l=>po.appendChild(chip(l,rowCol(l))))}\n  const l=$('selTarget').value;\n  if(l){const pl=tplayers(l);if(!pl.length)to.appendChild(el('span','empty','No player assigned'));pl.forEach(x=>to.appendChild(chip(x.name,pcol(x))))}\n}\n\n/* ---------- events ---------- */\n$('legion').oninput=e=>{S.legion=e.target.value;save();\n  const on=document.querySelector('.tab.on');if(on)on.textContent=S.legion||'Legion'};\n$('count').onchange=e=>{let v=parseInt(e.target.value)||1;v=Math.max(1,Math.min(20,v));S.count=v;save();render()};\n$('addBtn').onclick=()=>{addPlayer($('newName').value);$('newName').value='';save();render();$('newName').focus()};\n$('newName').onkeydown=e=>{if(e.key==='Enter')$('addBtn').click()};\n$('bulkBtn').onclick=()=>{$('bulk').value.split(/\\r?\\n/).forEach(addPlayer);$('bulk').value='';save();render();toast('Players added')};\n$('clearBtn').onclick=()=>{if(confirm('Clear ALL target assignments of this legion? (players stay)')){S.players.forEach(p=>p.t=[]);save();render()}};\n$('delLegion').onclick=()=>{\n  if(ROOT.legions.length<2)return;\n  if(confirm('Delete legion \"'+S.legion+'\" with all its players and targets?')){\n    ROOT.legions=ROOT.legions.filter(l=>l.id!==S.id);switchLegion(ROOT.legions[0].id);\n  }\n};\n$('themeBtn').onclick=()=>{\n  const i=THEME_ORDER.indexOf(ROOT.theme);ROOT.theme=THEME_ORDER[(i+1)%THEME_ORDER.length];save();render();\n};\n$('selPlayer').onchange=showLookup;$('selTarget').onchange=showLookup;\n\n/* ---------- text export ---------- */\nfunction buildText(){\n  let s=`*${S.legion} — Targets*\\n\\n*Players*\\n`;\n  S.players.forEach(p=>{s+=`${p.name}: ${ptargets(p).join(', ')||'—'}\\n`});\n  s+=`\\n*Targets*\\n`;\n  labels().forEach(l=>{s+=`${l}: ${tplayers(l).map(p=>p.name).join(', ')||'—'}\\n`});\n  return s;\n}\n$('copyBtn').onclick=async()=>{\n  const t=buildText();\n  try{await navigator.clipboard.writeText(t);toast('Copied — paste in WhatsApp')}\n  catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('Copied — paste in WhatsApp')}\n};\n\n/* ---------- image export ---------- */\nconst FONT='Segoe UI,Arial,sans-serif';\nfunction rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}\nfunction fit(ctx,t,maxW){if(ctx.measureText(t).width<=maxW)return t;while(t.length>1&&ctx.measureText(t+'…').width>maxW)t=t.slice(0,-1);return t+'…'}\nfunction layoutChips(ctx,items,maxW,font,chipH,padX,gap){\n  ctx.font=font;const out=[];let x=0,y=0;\n  items.forEach(it=>{\n    const w=Math.min(ctx.measureText(it.text).width+padX*2,maxW);\n    if(x>0&&x+w>maxW){x=0;y+=chipH+gap}\n    out.push({...it,x,y,w,pad:padX});x+=w+gap;\n  });\n  return {chips:out,h:items.length?y+chipH:0};\n}\nfunction drawChips(ctx,lay,ox,oy,font,chipH,padX){\n  ctx.font=font;ctx.textBaseline='middle';\n  lay.chips.forEach(c=>{\n    ctx.fillStyle=c.color;rr(ctx,ox+c.x,oy+c.y,c.w,chipH,chipH*0.32);ctx.fill();\n    ctx.fillStyle=textOn(c.color);ctx.textAlign='left';\n    ctx.fillText(fit(ctx,c.text,c.w-c.pad*2+1),ox+c.x+c.pad,oy+c.y+chipH/2+1);\n  });\n}\nfunction rgbOf(col){\n  const c=document.createElement('canvas').getContext('2d');c.fillStyle=col;const v=c.fillStyle;\n  if(v[0]==='#')return [parseInt(v.slice(1,3),16),parseInt(v.slice(3,5),16),parseInt(v.slice(5,7),16)];\n  return v.match(/[\\d.]+/g).slice(0,3).map(Number);\n}\nfunction mix(col,a){\n  const [r,g,b]=rgbOf(col),[br,bg,bb]=rgbOf(TH().base);\n  return `rgb(${Math.round(br+(r-br)*a)},${Math.round(bg+(g-bg)*a)},${Math.round(bb+(b-bb)*a)})`;\n}\nfunction tileBg(ctx,x,y,w,h,col){\n  const g=ctx.createLinearGradient(x,y,x+w,y+h);\n  g.addColorStop(0,mix(col,0.32));g.addColorStop(1,mix(col,0.12));\n  ctx.fillStyle=g;rr(ctx,x,y,w,h,26);ctx.fill();\n  ctx.strokeStyle=col;ctx.globalAlpha=.6;ctx.lineWidth=3;rr(ctx,x+1.5,y+1.5,w-3,h-3,25);ctx.stroke();ctx.globalAlpha=1;\n}\nfunction buildCanvas(){\n  const T=TH(),W=1600,pad=40,H=12000;\n  const big=document.createElement('canvas');big.width=W;big.height=H;\n  const ctx=big.getContext('2d');\n  ctx.fillStyle=T.bg;ctx.fillRect(0,0,W,H);\n  let y=pad;\n  ctx.textBaseline='top';ctx.textAlign='left';ctx.fillStyle=T.txt;ctx.font='bold 56px '+FONT;\n  ctx.fillText(S.legion||'Legion',pad,y);y+=70;\n  ctx.fillStyle=T.mut;ctx.font='26px '+FONT;\n  ctx.fillText('Target plan · '+new Date().toLocaleDateString(),pad,y);y+=60;\n\n  // players -> targets\n  ctx.fillStyle=T.mut;ctx.font='bold 28px '+FONT;ctx.fillText('PLAYERS  →  TARGETS',pad,y);y+=46;\n  const cols=3,gap=20,tw=(W-pad*2-gap*(cols-1))/cols,pf='bold 30px '+FONT;\n  for(let i=0;i<S.players.length;i+=cols){\n    const row=S.players.slice(i,i+cols);\n    const lays=row.map(p=>layoutChips(ctx,ptargets(p).map(l=>({text:l,color:rowCol(l)})),tw-44,pf,50,12,16));\n    const rh=Math.max(...lays.map(l=>Math.max(l.h,44)))+24+44+22;\n    row.forEach((p,k)=>{\n      const x=pad+k*(tw+gap),col=pcol(p);\n      tileBg(ctx,x,y,tw,rh,col);\n      ctx.fillStyle=col;rr(ctx,x,y+22,8,rh-44,4);ctx.fill();\n      ctx.fillStyle=ptxt(p);ctx.font='bold 34px '+FONT;ctx.textBaseline='top';ctx.textAlign='left';\n      ctx.fillText(fit(ctx,p.name,tw-50),x+26,y+18);\n      if(lays[k].chips.length)drawChips(ctx,lays[k],x+26,y+70,pf,50,12);\n      else{ctx.fillStyle=T.mut;ctx.font='26px '+FONT;ctx.textBaseline='top';ctx.textAlign='left';ctx.fillText('—',x+26,y+76)}\n    });\n    y+=rh+gap;\n  }\n  y+=30;\n\n  // targets -> players : wide rectangles, height grows with the names\n  ctx.textBaseline='top';ctx.textAlign='left';ctx.fillStyle=T.mut;ctx.font='bold 28px '+FONT;ctx.fillText('TARGETS  →  PLAYERS',pad,y);y+=46;\n  const L=labels(),tc=2,tg=16,ttw=(W-pad*2-tg*(tc-1))/tc,labW=100,tf='bold 27px '+FONT;\n  for(let i=0;i<L.length;i+=tc){\n    const row=L.slice(i,i+tc);\n    const lays=row.map(l=>layoutChips(ctx,tplayers(l).map(p=>({text:p.name,color:pcol(p)})),ttw-labW-34,tf,46,14,12));\n    const rh=Math.max(...lays.map(l=>Math.max(l.h,46)))+32;\n    row.forEach((l,k)=>{\n      const x=pad+k*(ttw+tg),col=rowCol(l);\n      tileBg(ctx,x,y,ttw,rh,col);\n      ctx.fillStyl ngth>=3&&nt.includes(t))sc+=10});\n    if(sc>bs){bs=sc;best=p}\n  });\n  if(best)used.add(best.id);\n  return best;\n}\nfunction parseRows(rows){\n  let nameCol=-1;\n  for(const r of rows){\n    const i=r.findIndex(c=>/^player(\\s*name)?$/i.test(String(c==null?'':c).trim()));\n    if(i>=0){nameCol=i;break}\n  }\n  const out=[];\n  for(const r of rows){\n    const cells=r.map(c=>c==null?'':String(c).trim());\n    const targets=[];\n    cells.forEach(c=>{const m=c.match(/^([A-Da-d])\\s*([1-5])$/);if(m){const t=m[1].toUpperCase()+m[2];if(!targets.includes(t))targets.push(t)}});\n    let name=nameCol>=0?(cells[nameCol]||''):(cells.find(c=>c&&!/^\\d+$/.test(c)&&!/^[A-Da-d]\\s*[1-5]$/.test(c)&&!/hit|breaker|target|remark/i.test(c))||'');\n    if(!name||/^player(\\s*name)?$/i.test(name))continue;\n    if(/^[A-Da-d]\\s*[1-5]$/.test(name))continue;\n    const srOk=nameCol>0&&cells.slice(0,nameCol).some(c=>/^\\d+$/.test(c));\n    if(!targets.length&&!srOk)continue;\n    out.push({name,targets,ib:cells.some(c=>/item\\s*breaker/i.test(c))});\n  }\n  return out;\n}\nfunction openImport(){$('modal').classList.add('on');$('prev').innerHTML='';$('impFoot').hidden=true;IMP=null}\nfunction closeImport(){$('modal').classList.remove('on')}\nfunction showPreview(rows){\n  if(!rows.length){toast('No player rows with targets found');return}\n  const used=new Set();\n  IMP={rows:rows.map(r=>{const g=guessPlayer(r.name,used);return {...r,map:g?g.id:'new'}})};\n  renderPreview();\n}\nfunction renderPreview(){\n  const box=$('prev');box.innerHTML='';\n  const nT=IMP.rows.reduce((a,r)=>a+r.targets.length,0);\n  box.appendChild(el('div','ihead',IMP.rows.length+' players found · '+nT+' targets — check the matching, then Apply'));\n  IMP.rows.forEach((r,i)=>{\n    const row=el('div','irow'+(r.map==='skip'?' skip':''));\n    const nm=el('div','nm',r.name);if(r.ib)nm.appendChild(el('small',null,'Item Breaker'));\n    row.appendChild(nm);\n    const ch=el('div','chips');\n    if(!r.targets.length)ch async function tgImportFile(file){

    if(/\.csv$/i.test(file.name)||file.type==='text/csv')rows=[parseCsv(await file.text())];
    else rows=xlsxSheets(await unzipFile(await file.arrayBuffer()));
    let best=null;
    for(const rs of rows){
      let hi=-1,cn=-1;
      for(let i=0;i<Math.min(rs.length,15)&&hi<0;i++){const r=rs[i]||[];for(let c=0;c<r.length;c++){const k=tgNorm(r[c]);if(k==='playername'||k==='player'||k==='name'){hi=i;cn=c;break}}}
      if(hi<0)continue;
      const H=(rs[hi]||[]).map(tgNorm),tc=[];H.forEach((k,c)=>{if(k.startsWith('target')&&!k.includes('clear'))tc.push(c)});
      const rm=H.findIndex(k=>k.startsWith('remark')||k==='note'||k==='notes');
      const out=[];
      for(let i=hi+1;i<rs.length;i++){
        const r=rs[i]||[],nm=r[cn];if(nm==null||String(nm).trim()==='')continue;
        const cells=new Set(),scan=txt=>{String(txt==null?'':txt).replace(/\b([A-Da-d])\s*([1-5])\b/g,(m,a,b)=>{cells.add(a.toUpperCase()+b);return m})};
        if(tc.length)tc.forEach(c=>scan(r[c]));else r.forEach((v,c)=>{if(c!==cn&&c!==rm)scan(v)});
        out.push({name:String(nm).trim(),cells:[...cells].sort(),note:rm>=0&&r[rm]!=null?String(r[rm]).trim():''});
      }
      if(out.length){best=out;break}
    }
    if(!best)throw new Error('Could not find a "Player Name" column with players under it.');
    const L=tgCur(),withT=best.filter(x=>x.cells.length).length;
    if(!confirm('Import '+best.length+' players ('+withT+' with targets) into "'+L.name+'"?\n\nNew players are added; existing players with the same name get their targets replaced.'))return;
    best.forEach(x=>{
      let p=L.players.find(q=>tgNorm(q.name)===tgNorm(x.name));
      if(!p){p={id:'p'+tgNewId()+Math.random().toString(36).slice(2,4),name:x.name,note:''};L.players.push(p)}
      if(x.cells.length){L.assign[p.id]=x.cells;x.cells.forEach(()=>{});Object.keys(L.hit).forEach(k=>{if(k.startsWith(p.id+'|'))delete L.hit[k]})}
      if(x.note)p.note=x.note;
    });
    tgSel='';save();render();toast('Imported '+best.length+' players');
  }catch(err){alert('Import failed: '+(err&&err.message||err))}
}

/* ===== Import / export pilot sheet (Excel .xlsx or .csv) ===== */
async function unzipFile(buf){
  const dv=new DataView(buf),u8=new Uint8Array(buf);
  let e=u8.length-22;while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;
  if(e<0)throw new Error('This is not an Excel (.xlsx) file.');
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const out={};
  for(let i=0;i<n;i++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const meth=dv.getUint16(p+10,true),csz=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);
    const name=new TextDecoder().decode(u8.subarray(p+46,p+46+nl));p+=46+nl+xl+cl;
    if(!/\.(xml|rels)$/.test(name))continue;
    const lnl=dv.getUint16(off+26,true),lxl=dv.getUint16(off+28,true),ds=off+30+lnl+lxl,raw=u8.subarray(ds,ds+csz);
    if(meth===0)out[name]=new TextDecoder().decode(raw);
    else if(meth===8){
      if(typeof DecompressionStream==='undefined')throw new Error('This browser cannot open .xlsx here. Save the sheet as CSV and upload that instead.');
      out[name]=await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
    }
  }
  return out;
}
const xColIdx=ref=>{let n=0;for(const ch of String(ref).replace(/[0-9]/g,''))n=n*26+ch.charCodeAt(0)-64;return n-1};
function xlsxSheets(files){
  const dp=new DOMParser(),px=t=>dp.parseFromString(t,'application/xml'),ss=[];
  if(files['xl/sharedStrings.xml'])px(files['xl/sharedStrings.xml']).querySelectorAll('si').forEach(si=>{
    ss.push([...si.children].filter(c=>c.localName!=='rPh').map(c=>[...c.querySelectorAll('t')].map(t=>t.textContent).join('')||(c.localName==='t'?c.textContent:'')).join(''))});
  let paths=[];
  try{
    const tm={};px(files['xl/_rels/workbook.xml.rels']).querySelectorAll('Relationship').forEach(r=>tm[r.getAttribute('Id')]=r.getAttribute('Target'));
    px(files['xl/workbook.xml']).querySelectorAll('sheet').forEach(sh=>{const t=tm[sh.getAttribute('r:id')];if(t)paths.push(t.charAt(0)==='/'?t.slice(1):'xl/'+t)});
  }catch(_){}
  if(!paths.length)paths=Object.keys(files).filter(k=>/^xl\/worksheets\/sheet\d+\.xml$/.test(k)).sort();
  return paths.filter(p=>files[p]).map(p=>{
    const rows=[];
    px(files[p]).querySelectorAll('row').forEach(r=>{
      const arr=[];
      r.querySelectorAll('c').forEach(c=>{
        const t=c.getAttribute('t'),ref=c.getAttribute('r'),v=c.querySelector('v');let val=null;
        if(t==='s')val=v?ss[+v.textContent]:null;
        else if(t==='inlineStr')val=[...c.querySelectorAll('t')].map(x=>x.textContent).join('');
        else if(v)val=(t==='str'||t==='e'||t==='b'||isNaN(+v.textContent))?v.textContent:+v.textContent;
        arr[ref?xColIdx(ref):arr.length]=val;

      rows.push(arr);
    });
    return rows;
  });
}
function parseCsv(txt){
  const rows=[];let row=[],cur='',q=false;
  txt=txt.replace(/^﻿/,'');
  for(let i=0;i<txt.length;i++){
    const c=txt[i];
    if(q){if(c==='"'){if(txt[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;
    else if(c===','||c===';'||c==='\t'){row.push(cur);cur=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&txt[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur=''}
    else cur+=c;
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  return rows;
}
const pNorm=x=>String(x==null?'':x).toLowerCase().replace(/[^a-z0-9]/g,'');
function readPilotRows(rows){
  let hi=-1,cn=-1;
  for(let i=0;i<Math.min(rows.length,15)&&hi<0;i++){
    const r=rows[i]||[];
    for(let c=0;c<r.length;c++){const k=pNorm(r[c]);if(k==='pilotname'||k==='pilot'||k==='name'){hi=i;cn=c;break}}
  }
  if(hi<0)return null;
  const H=(rows[hi]||[]).map(pNorm);
  const find=(re)=>H.findIndex(h=>re.test(h));
  const cs=find(/shard/),ct=find(/star/),cu=find(/upgrade|level/);
  const byName={};PILOTS.forEach(a=>{byName[pNorm(a[0])]=a});
  const found={},unknown=[];
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i]||[];const nm=r[cn];if(nm==null||String(nm).trim()==='')continue;
    const a=byName[pNorm(nm)];
    if(!a){unknown.push(String(nm).trim());continue}
    const num=v=>{const n=parseFloat(String(v==null?'':v).replace(/,/g,''));return isNaN(n)?0:Math.max(0,Math.round(n))};
    const star=v=>{if(v==null||v==='')return 0;if(typeof v==='number')return Math.max(-1,Math.min(7,Math.round(v)));const t=String(v).toLowerCase();if(/awak/.test(t))return 7;if(/lock/.test(t))return -1;const n=parseInt(t.replace(/[^0-9]/g,''),10);return isNaN(n)?0:Math.min(7,n)};
    found[a[0]]={s:cs>=0?num(r[cs]):0,st:ct>=0?star(r[ct]):0,up:cu>=0?Math.min(10,num(r[cu])):0};
  }
  return {found,unknown};
}

    const n=Object.keys(res.found).length;
    if(!n)throw new Error('No pilot names in this file matched the pilot list.');
    const pl=P(pmsPid);
    if(!confirm('Import '+n+' pilots into '+(pl?pl.name:'this player')+'?\n\nThis overwrites their pilot shards, star status and upgrade level for those pilots. Other pilots and the inventory are not touched.'))return;
    const m=getPms(pmsPid);
    Object.entries(res.found).forEach(([k,v])=>{m.p[k]={s:v.s,st:v.st,up:v.up}});
    m._seeded=true;save();render();
    if(res.unknown.length)alert('Imported '+n+' pilots.\n\nNot recognised (skipped): '+res.unknown.slice(0,15).join(', ')+(res.unknown.length>15?' …':''));
    else toast('Imported '+n+' pilots');
  }catch(err){alert('Import failed: '+(err&&err.message||err))}
}
function exportPilotCsv(){
  const m=getPms(pmsPid),pl=P(pmsPid),q=v=>{v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const head=['Sr. No.','Category','Pilot Name','Attribute','Available Shards','Passive Skills','Star Status','Upgrade Status'];
  const rows=PILOTS.map((a,i)=>{const s=pst(m,a);return [i+1,a[1],a[0],a[2],s.s||'',a[3],s.st>=7?'Awakened':s.st<0?'Locked':s.st,s.up||'']});
  dl('Pilot_Attributes-'+(pl?pl.name.replace(/[^A-Za-z0-9]+/g,'_'):'player')+'.csv','text/csv;charset=utf-8','﻿'+[head,...rows].map(r=>r.map(q).join(',')).join('\r\n'));
}

/* ============ LOGIC ============ */
const bcls=o=>o==='Advance'?'b-adv':o==='Unchanged'?'b-same':'b-dem';
function tierOutcome(tier,rank){
  const t=TIERS.find(x=>x[0]===tier);if(!t||!rank)return null;
  for(const [rng,out] of t[1]){const [a,b]=rng.split('-').map(Number);if(rank>=a&&rank<=b)return {out,change:t[2],pts:t[3]}}
  return null;
}
function resultBadge(p){
  const r=tierOutcome(p.tcTier,p.tcRank);if(!r)return '<span class="cnt">—</span>';
  const got=r.out==='Advance'&&r.pts&&p.rewards&&p.rewards[p.tcTier];
  return `<span class="badge ${bcls(r.out)}">${r.out==='Advance'?'⬆ '+r.change:r.out==='Unchanged'?'＝ Unchanged':'⬇ Demotion'}</span>`+
    (got?' <span class="cnt" title="Tier rewards are paid one time only">🎁 already received · no reward</span>':(r.out==='Advance'&&r.pts?` <span class="cnt">${r.pts.toLocaleString()} pts</span>`:''));
}
function getPath(p,parts){let o=p;for(let i=0;i<parts.length-1;i++)o=o[parts[i]];return [o,parts[parts.length-1]]}

document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='cTier'||el.id==='cRank'){
    const r=tierOutcome(document.getElementById('cTier').value,+document.getElementById('cRank').value);
    document.getElementById('cOut').innerHTML=r?`<span class="badge ${bcls(r.out)}">${r.out}</span> ${r.out==='Advance'?r.change+' · '+r.pts.toLocaleString()+' reward points':''}`:'Rank outside this tier\'s range';
    return;
  }
  if(el.dataset.item){
    const [sid,iid,f]=el.dataset.item.split('|');const it=shopById(sid).items.find(x=>x.id===iid);if(!it)return;
    if(f==='name')it.name=el.value;
    else if(f==='icon')it.icon=el.value;
    else{const clean=el.value.replace(/,/g,'.').replace(/[^0-9.]/g,'');if(clean!==el.value)el.value=clean;const v=parseFloat(clean);it[f]=isNaN(v)?null:v}
    save();return;
  }
  if(el.id==='focusQtyIn'){
    const clean=el.value.replace(/[^0-9]/g,'');if(clean!==el.value)el.value=clean;
    const p=P(canPid);if(!p)return;p.focus.qty=clean===''?null:parseInt(clean,10);
    const r=document.getElementById('focusRes');if(r)r.innerHTML=focusRes(p);save();return;
  }
  if(el.dataset.pms){
    const clean=el.value.replace(/[^0-9]/g,'');if(clean!==el.value)el.value=clean;
    const v=clean===''?0:parseInt(clean,10),[g,k]=el.dataset.pms.split('|'),m=getPms(pmsPid);
    if(g==='inv')m.inv[k]=v;else{const a=PILOTS.find(x=>x[0]===k);if(a)pst(m,a).s=v}
    save();pmsRefresh();return;
  }
  if(el.id==='pmsQ'){pmsQ=el.value;pmsApplyQ();return}
  const d=el.dataset.in;if(!d)return;
  const parts=d.split('|');const p=P(parts[0]);const path=parts.slice(1);
  const [o,k]=getPath(p,path);
  if(el.dataset.num){
    const clean=el.value.replace(/,/g,'.').replace(/[^0-9.]/g,'');if(clean!==el.value)el.value=clean;
    let v=el.value===''?null:parseFloat(el.value);if(v!=null&&isNaN(v))v=null;
    if(v!=null&&path[0]==='cc'&&v>84){v=84;el.value=84}
    if(v!=null&&path[0]==='tcRank'&&v>50){v=50;el.value=50}
    o[k]=v;
  }else o[k]=el.value;
  if(path[0]==='points'&&shopView==='can')refreshCan();
  if(path[0]==='tcTier'||path[0]==='tcRank'){const c=document.getElementById('res-'+p.id);if(c)c.innerHTML=resultBadge(p)}
  save();
});
/* keep the field visible when the phone keyboard opens */
let typT;
document.addEventListener('focusin',e=>{
  if(!/^(INPUT|SELECT)$/.test(e.target.tagName))return;
  if(e.target.tagName==='INPUT')e.target.setAttribute('enterkeyhint','enter');
  clearTimeout(typT);document.body.classList.add('typing');
  const el=e.target;
  if(el.tagName==='INPUT'){const v0=el.value;const sel=()=>{if(document.activeElement===el&&el.value===v0){try{el.select()}catch(_){}}};setTimeout(sel,0);setTimeout(sel,120)}
  setTimeout(()=>{try{el.scrollIntoView({block:'center',inline:'nearest'})}catch(_){}},350);
});
/* Enter / keyboard action button: go to the box BELOW (same column), not to the right */
document.addEventListener('keydown',e=>{
  const el=e.target;
  if((e.key!=='Enter'&&e.keyCode!==13)||el.tagName!=='INPUT')return;
  e.preventDefault();
  if(el.dataset.rank){el.blur();return}
  const td=el.closest('td');const tr=td&&td.parentElement;if(!tr){el.blur();return}
  const idx=[...tr.children].indexOf(td);
  const next=e.shiftKey?tr.previousElementSibling:tr.nextElementSibling;
  const target=next&&next.children[idx]&&next.children[idx].querySelector('input:not([data-rank]),select');
  if(target)target.focus();else el.blur();
});
document.addEventListener('focusout',()=>{
  clearTimeout(typT);
  typT=setTimeout(()=>{if(!/^(INPUT|SELECT)$/.test((document.activeElement||{}).tagName||''))document.body.classList.remove('typing')},250);
});
document.addEventListener('change',e=>{
  const id=e.target.dataset&&e.target.dataset.rank;if(!id)return;
  const n=parseInt(e.target.value,10);if(!n){render();return}
  movePlayer(id,n-1);
});
document.addEventListener('change',e=>{

  if(el.id==='pmsPlayer'){pmsPid=el.value;render();return}

    const a=PILOTS.find(x=>x[0]===(el.dataset.pmsst||el.dataset.pmslv)),s=pst(getPms(pmsPid),a);
    if(el.dataset.pmsst)s.st=+el.value;else s.up=+el.value;save();render();return}

  if(e.target.id==='focusCb'){const p=P(canPid);if(p){if(!p.focus)p.focus={item:'',qty:1};p.focus.cb=e.target.checked;const r=document.getElementById('focusRes');if(r)r.innerHTML=focusRes(p);save()}return}
  if(e.target.id==='focusSel'){

document.getElementById('fileImp').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{
    try{const d=JSON.parse(r.result);if(!d.players)throw 0;if(confirm('Replace all current data with this backup?')){const bd=d._board;delete d._board;S=d;migrate();save();try{if(bd)localStorage.setItem(BOARD_KEY,bd)}catch(_){}render()}}

/* drag the bar on the Player column header to resize it */

/* ============ ACTIONS ============ */
function movePlayer(id,to){
  const from=S.players.findIndex(p=>p.id===id);to=Math.max(0,Math.min(S.players.length-1,to));
  if(from<0||to===from){render();return}
  const [p]=S.players.splice(from,1);S.players.splice(to,0,p);save();render();
}
function newDay(){
  if(!confirm('Start a new day? All Daily Task buttons will turn red again. (Numbers are not touched.)'))return;
  S.players.forEach(p=>DAILY.forEach(([k])=>p.daily[k]=false));
  S.date=todayStr();save();render();
}
function newSeason(){
  if(!confirm('Start a new season?\n\n• Every player goes back to Bronze (TC Tier = Bronze, TC Rank cleared)\n• All tier-reward buttons are cleared, so rewards can be earned again\n\nThis cannot be undone. Take a 💾 Backup first if unsure.'))return;
  S.players.forEach(p=>{p.tcTier='Bronze';p.tcRank=null;p.rewards={}});
  save();render();
}
function newWeek(){
  if(!confirm('Start a new week?\n\n• Legion Hunt: damage cleared\n• Weekly Total Loot is cleared\n• Players whose TC result is Advance are recorded as having received that tier reward (one time only)\n\nTip: take a 💾 Backup first if unsure.'))return;
  S.players.forEach((p,i)=>{
    const tr=tierOutcome(p.tcTier,p.tcRank);if(tr&&tr.out==='Advance'&&tr.pts)p.rewards[p.tcTier]=true;
    LEGION.forEach(([k])=>{const a=p.legion[k];if(a[1]!=null)a[0]=a[1];a[1]=null});
    p.loot=null;
  });
  save();render();
}
function dl(name,mime,data){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:mime}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function exportJson(){let bd=null;try{bd=localStorage.getItem(BOARD_KEY)}catch(_){}dl('legion-tracker-backup-'+todayStr()+'.json','application/json',JSON.stringify(Object.assign({},S,{_board:bd}),null,1))}
function exportCsv(){
  const q=v=>{v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const head=['Player','Titan BP (M)','Max PP','CC Level','Rare Earths','Total Weekly Loot','TC Tier','TC Rank',
    ...DAILY.map(d=>d[1]),
    ...LEGION.map(l=>l[1]+' Damage'),
    ...TIERS.filter(t=>t[3]).map(t=>t[2]+' reward received'),
    ...SETS.map(s=>s[1]+' pieces (of 4)'),
    ...S.shops.map(x=>x.name+' Points')];
  const rows=S.players.map(p=>[p.name,p.bp,p.pp,p.cc,p.rare,p.loot,p.tcTier,p.tcRank,
    ...DAILY.map(([k])=>p.daily[k]?'Done':''),
    ...LEGION.map(([k])=>p.legion[k][1]),
    ...TIERS.filter(t=>t[3]).map(t=>p.rewards[t[0]]?'Yes':''),
    ...SETS.map(([k])=>p.gear[k].filter(Boolean).length),
    ...S.shops.map(x=>p.points[x.id])]);
  dl('Legion_Report_'+todayStr()+'.csv','text/csv;charset=utf-8','﻿'+[head,...rows].map(r=>r.map(q).join(',')).join('\r\n'));
}
